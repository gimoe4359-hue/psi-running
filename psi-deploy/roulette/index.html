<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대싸이날 잭팟 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 1920x1080 고정 무대를 화면에 맞춰 확대/축소. 왼쪽 위 확률표, 왼쪽 아래 뽑기, 오른쪽 실시간 3D 카지노 룰렛. 단일 다크 룩. */
:root{
  --black:#050203; --gold:#e9c46a; --gold-hi:#fff1c4; --gold-lo:#8a5a12;
  --ink:#fff6e6; --mute:#c9ab7c;
  --t-n:#8d8a96; --t-r:#4aa3ff; --t-sr:#b26bff; --t-ssr:#ffc23d; --t-x:#7dffcf;
  --f-lat:"Cinzel","Noto Serif KR",serif;
  --f-ser:"Noto Serif KR","Cinzel",serif;
  --f-sans:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--black);color:var(--ink);font-family:var(--f-sans);overflow:hidden}
#vp{position:fixed;inset:0;overflow:hidden;background:var(--black)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0a0403}
#bg,#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 72% at 64% 52%,transparent 38%,rgba(0,0,0,.82) 100%);transition:background .8s}
body.tense .vign{background:radial-gradient(ellipse 55% 50% at 50% 52%,transparent 30%,rgba(40,0,0,.85) 100%)}

/* 확률표 */
.odds{position:absolute;left:80px;top:80px;width:400px;padding:22px 26px 18px;
  background:linear-gradient(180deg,rgba(24,11,7,.86),rgba(9,3,3,.92));
  border:1px solid rgba(233,196,106,.55);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px rgba(0,0,0,.35),inset 0 0 0 7px rgba(233,196,106,.18);
  transition:opacity .6s,transform .6s}
.odds::before,.odds::after{content:"";position:absolute;width:30px;height:30px;border:2px solid var(--gold);pointer-events:none}
.odds::before{left:-6px;top:-6px;border-right:0;border-bottom:0}
.odds::after{right:-6px;bottom:-6px;border-left:0;border-top:0}
.odds-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid rgba(233,196,106,.35)}
.odds-h b{font-family:var(--f-lat);font-weight:900;font-size:30px;letter-spacing:.3em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.odds-h span{font-size:14px;color:var(--mute);letter-spacing:.08em}
.orow{display:grid;grid-template-columns:14px 74px minmax(0,1fr) 96px;align-items:center;gap:10px;height:40px}
.gem{width:10px;height:10px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 12px var(--c),inset 0 0 0 2px rgba(255,255,255,.45)}
.orow .rk{font-family:var(--f-ser);font-weight:900;font-size:21px;color:var(--ink)}
.orow .ld{height:2px;background:repeating-linear-gradient(90deg,rgba(233,196,106,.45) 0 3px,transparent 3px 10px)}
.orow .pc{font-family:var(--f-lat);font-weight:700;font-size:25px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-hi);text-shadow:0 0 18px rgba(255,190,80,.45)}
.orow .pc small{font-size:16px;margin-left:2px;color:var(--gold)}
.orow.out{opacity:.25}
.orow.out .rk{text-decoration:line-through}

/* 뽑기 버튼 */
.pull{position:absolute;left:80px;top:870px;width:300px;height:130px;border:0;padding:0;cursor:pointer;border-radius:999px;
  background:linear-gradient(180deg,#fff6cf 0%,#f3d27a 20%,#d29a33 48%,#9b6410 52%,#e2b04c 78%,#fff0b8 100%);
  box-shadow:0 0 0 3px #3b1d00,0 0 0 7px #e9c46a,0 0 0 9px #3b1d00,0 18px 40px rgba(0,0,0,.7),0 0 80px rgba(255,180,60,.45);
  overflow:hidden;transition:transform .12s,filter .2s,opacity .6s;animation:pulse 2s ease-in-out infinite}
.pull::before{content:"";position:absolute;top:-20%;bottom:-20%;width:120px;left:-160px;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:sweep 2.6s ease-in-out infinite}
.pull .t{position:relative;display:block;font-family:var(--f-ser);font-weight:900;font-size:64px;line-height:1;color:#3b1d00;letter-spacing:.2em;padding-left:.2em;text-shadow:0 2px 0 rgba(255,246,200,.8),0 -1px 0 rgba(0,0,0,.25)}
.pull .s{position:relative;display:block;margin-top:8px;font-family:var(--f-lat);font-weight:700;font-size:17px;letter-spacing:.22em;color:#5a3204}
.pull.multi{left:404px;width:250px;background:linear-gradient(180deg,#ff8a8a 0%,#d4183a 20%,#8f0c22 48%,#5a0412 52%,#b3142e 78%,#ff9a8a 100%);
  box-shadow:0 0 0 3px #2a0006,0 0 0 7px #e9c46a,0 0 0 9px #2a0006,0 18px 40px rgba(0,0,0,.7),0 0 80px rgba(255,60,80,.4);animation:pulseR 2s ease-in-out infinite}
.pull.multi .t{font-size:46px;letter-spacing:.06em;padding-left:0;color:#ffe7a8;text-shadow:0 2px 0 #3a0008,0 0 18px rgba(255,200,120,.5)}
.pull.multi .s{color:#ffd59a}
@keyframes pulseR{50%{box-shadow:0 0 0 3px #2a0006,0 0 0 7px #e9c46a,0 0 0 9px #2a0006,0 18px 40px rgba(0,0,0,.7),0 0 120px rgba(255,80,90,.75)}}
/* 카드 뒤집기 */
.cardstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;perspective:1800px}
.cardstage.grid{display:block}
body.cutting #bg,body.cutting #gl,body.cutting .persp,body.cutting .vign,body.cutting .leak,body.cutting #glint,body.cutting #post,body.cutting .odds,body.cutting .pull,body.cutting .stepper,body.cutting .gear,body.cutting .reset-btn,body.cutting .lb{visibility:hidden}
.cardstage.grid~.ghint{bottom:22px}
.gpos{position:absolute;transform:translate(-50%,-50%) scale(var(--k,1))}
.stepper{position:absolute;left:404px;top:806px;width:250px;height:48px;display:flex;align-items:stretch;border-radius:999px;overflow:hidden;
  border:2px solid rgba(233,196,106,.7);background:rgba(20,6,6,.85);box-shadow:0 8px 20px rgba(0,0,0,.5);transition:opacity .6s,transform .6s}
.stepper button{width:62px;border:0;background:transparent;color:var(--gold);font-family:var(--f-lat);font-weight:900;font-size:28px;cursor:pointer}
.stepper button:hover:not(:disabled){background:rgba(233,196,106,.15)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper input{flex:1;min-width:0;width:100%;border:0;border-inline:1px solid rgba(233,196,106,.35);background:transparent;color:var(--ink);text-align:center;
  font-family:var(--f-lat);font-weight:700;font-size:26px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:2px solid #fff;outline-offset:-2px}
body.cine .stepper{opacity:0;transform:translateX(-40px);pointer-events:none}
.gwrap{animation:gIn .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes gIn{from{transform:translateY(120px) scale(.6) rotateX(30deg);opacity:0}}
.gcard{--c:#fff;position:relative;width:400px;height:600px;transform-style:preserve-3d;will-change:transform;transition:transform .75s cubic-bezier(.45,1.5,.5,1)}
.gcard.big{width:460px;height:690px}
.cardstage.grid .gcard:not(.flip){cursor:pointer}
.cardstage.grid .gcard:not(.flip):hover{transform:translateY(-16px) scale(1.03)}
.gcard.flip{transform:rotateY(180deg)}
.gcard.out{transition:transform .35s ease-in;transform:rotateY(90deg) scale(1.08)}
.gface{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.gback{background:radial-gradient(circle at 50% 40%,#3a1a0a,#0d0504 70%);border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(0,0,0,.5)}
.gwrap{position:relative}
.gglow{position:absolute;inset:-4px;border-radius:26px;box-shadow:0 0 70px 6px var(--c),0 0 160px var(--c);opacity:.5;animation:glowP 1.6s ease-in-out infinite;will-change:opacity;pointer-events:none}
@keyframes glowP{50%{opacity:1}}
.gback::before{content:"";position:absolute;inset:16px;border:1px solid rgba(233,196,106,.5);border-radius:14px;background:repeating-linear-gradient(45deg,rgba(233,196,106,.07) 0 2px,transparent 2px 14px)}
.gback::after{content:"";position:absolute;top:-50%;bottom:-50%;width:90px;left:-140px;transform:translateX(0) rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.4s ease-in-out infinite;will-change:transform}
@keyframes shine{0%,40%{transform:translateX(0) rotate(20deg)}100%{transform:translateX(720px) rotate(20deg)}}
.gback .emb{position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-lat);font-weight:900;font-size:62px;color:var(--gold);box-shadow:inset 0 0 30px rgba(233,196,106,.35),0 0 30px var(--c)}
.gback .emb::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px dashed rgba(233,196,106,.6);animation:spinR 20s linear infinite;will-change:transform}
.gback .q{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-family:var(--f-lat);font-weight:700;letter-spacing:.4em;color:rgba(233,196,106,.7);font-size:18px}
@keyframes aura{50%{box-shadow:0 0 0 8px rgba(0,0,0,.5),0 0 100px var(--c),0 0 220px var(--c)}}
.gfront{transform:rotateY(180deg);background:linear-gradient(170deg,color-mix(in srgb,var(--c) 45%,#120810),#07040a 72%);border:3px solid var(--c);box-shadow:0 0 60px var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:26px 22px 30px;gap:8px;text-align:center}
.gfront svg{position:absolute;left:50%;top:34px;width:300px;height:300px;transform:translateX(-50%)}
.gfront .gt{font-family:var(--f-lat);font-weight:700;font-size:18px;letter-spacing:.3em;color:var(--c)}
.gfront .gr{font-family:var(--f-ser);font-weight:900;font-size:50px;line-height:1;color:var(--c);text-shadow:0 0 20px var(--c)}
.gfront .gn{font-family:var(--f-ser);font-weight:900;font-size:36px;line-height:1.15;color:#fff;text-wrap:balance}
.gfront .gs{color:#ffd75e;font-size:30px;letter-spacing:.1em;min-height:36px;text-shadow:0 0 14px rgba(255,190,40,.8)}
.gfront .gx{position:absolute;left:50%;top:50px;width:260px;height:260px;transform:translateX(-50%);border:2px dashed #55535c;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#77747f;font-size:20px;letter-spacing:.1em}
.gfront .gm{position:absolute;left:50%;top:90px;transform:translateX(-50%) rotate(-8deg);font-family:var(--f-ser);font-weight:900;font-size:160px;line-height:1;color:#cfcbd8}
.ghint{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:28px;letter-spacing:.14em;color:rgba(255,255,255,.8);animation:blink 1.4s ease-in-out infinite}
.mini-jp{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:var(--f-lat);font-weight:900;font-size:120px;color:#ffe680;text-shadow:0 0 30px #ff9a00,0 6px 0 #6a2a00;animation:slam .4s cubic-bezier(.2,1.7,.4,1) both;pointer-events:none}
.pull:hover:not(:disabled){transform:translateY(-2px)}
.pull:active:not(:disabled){transform:translateY(4px)}
.pull:disabled{filter:saturate(.3) brightness(.55);animation:none;cursor:default}
.pull:disabled::before{display:none}
.pull:focus-visible{outline:4px solid #fff;outline-offset:10px}
@keyframes pulse{50%{box-shadow:0 0 0 3px #3b1d00,0 0 0 7px #e9c46a,0 0 0 9px #3b1d00,0 18px 40px rgba(0,0,0,.7),0 0 130px rgba(255,200,80,.85)}}
@keyframes sweep{0%,55%{left:-160px}100%{left:640px}}
body.cine .odds,body.cine .pull,body.cine .gear{opacity:0;transform:translateX(-40px);pointer-events:none}

/* 2D 대체 룰렛 (3D를 못 쓸 때만) */
.persp{position:absolute;left:700px;top:0;width:1120px;height:1080px;perspective:1900px}
.wheel3d{position:absolute;left:30px;top:10px;width:1060px;height:1060px;transform:rotateZ(-8deg) rotateX(31deg);transform-style:preserve-3d}
.wheel3d::before{content:"";position:absolute;inset:2%;border-radius:50%;background:rgba(0,0,0,.85);filter:blur(40px);transform:translate(3%,9%)}
#wheel{position:relative;width:1060px;height:1060px;display:block}

/* 시네마틱 */
.lb{position:absolute;left:0;right:0;height:120px;background:#000;z-index:20;transform:scaleY(0);transition:transform .7s cubic-bezier(.6,0,.2,1);display:flex;align-items:center;justify-content:space-between;padding-inline:96px}
.lb.t{top:0;transform-origin:top}.lb.b{bottom:0;transform-origin:bottom}
body.cine .lb{transform:scaleY(1)}
.lb span{font-family:var(--f-lat);font-weight:700;font-size:20px;letter-spacing:.4em;color:rgba(233,196,106,.7)}
.lb .rec{display:flex;align-items:center;gap:12px}
.lb .rec::before{content:"";width:12px;height:12px;border-radius:50%;background:#e0102c;box-shadow:0 0 10px #e0102c;animation:blink 1s steps(2) infinite}
.cap-cine{position:absolute;left:0;right:0;bottom:170px;z-index:21;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
.cap-cine.on{opacity:1}
.cap-cine b{display:inline-block;font-family:var(--f-ser);font-weight:900;font-size:78px;letter-spacing:.08em;color:#fff;
  text-shadow:0 0 30px rgba(255,170,60,.8),0 4px 0 rgba(0,0,0,.6);animation:beat .85s ease-in-out infinite}
.cap-cine small{display:block;margin-top:10px;font-family:var(--f-lat);font-weight:700;font-size:22px;letter-spacing:.5em;color:var(--gold)}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.04)}}

.gear{position:absolute;right:28px;bottom:24px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(233,196,106,.3);background:rgba(0,0,0,.35);
  color:rgba(233,196,106,.5);font-family:var(--f-lat);font-size:18px;cursor:pointer;z-index:22;transition:opacity .6s}
.menu{position:absolute;right:28px;bottom:80px;z-index:22;display:flex;flex-direction:column;gap:8px;padding:14px;background:rgba(10,4,4,.95);border:1px solid rgba(233,196,106,.45)}
.menu button{font:inherit;font-size:20px;color:var(--ink);background:transparent;border:1px solid rgba(233,196,106,.3);padding:10px 20px;cursor:pointer;text-align:left}
.menu button:disabled{opacity:.35;cursor:default}
.menu small{color:var(--mute);font-size:15px}
.menu .ms{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:17px;color:var(--mute)}
.menu select{font:inherit;font-size:16px;background:#1a0c08;color:var(--ink);border:1px solid rgba(233,196,106,.4);padding:6px 8px}

/* 컷씬 */
#cut{position:absolute;inset:0;z-index:50;background:#000}
#cutIn{position:absolute;inset:0}
#fxc{position:absolute;inset:0;width:1920px;height:1080px}
#cutUI{position:absolute;inset:0}
.glitch{animation:hue 1s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) saturate(1.5)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes blink{50%{opacity:.3}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.jp{display:flex;font-family:var(--f-lat);font-weight:900;font-size:230px;line-height:1;letter-spacing:.04em;
  background:linear-gradient(180deg,#fffbe6 15%,#ffd24a 48%,#c27a0a 52%,#ffe08a 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 0 #4a2000) drop-shadow(0 0 40px rgba(255,170,0,.8))}
.jp span{display:inline-block;animation:slam .38s cubic-bezier(.2,1.7,.4,1) both}
@keyframes slam{from{transform:scale(3.6) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(2);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:none}}
.miss{font-family:var(--f-ser);font-weight:900;font-size:260px;line-height:1;color:#cfcbd8;padding:10px 70px 24px;border:6px solid #8d8a96;outline:2px solid #8d8a96;outline-offset:10px;
  background:rgba(20,18,24,.7);transform:rotate(-6deg);animation:missIn .3s cubic-bezier(.3,1.9,.5,1) both}
@keyframes missIn{from{transform:rotate(-6deg) scale(2.6);opacity:0}to{transform:rotate(-6deg);opacity:1}}
.miss-sub{font-size:32px;color:#a8a4b2}
.alarm{display:flex;flex-direction:column;gap:14px;align-items:center}
.alarm div{font-family:var(--f-ser);font-weight:900;font-size:52px;color:#fff;background:#c40d2a;padding:6px 30px;animation:pop .3s both;box-shadow:0 0 40px rgba(255,0,40,.6)}
.seal-btn{font-family:var(--f-ser);font-weight:900;font-size:56px;padding:22px 80px;border-radius:999px;border:3px solid #fff;color:#fff;cursor:pointer;letter-spacing:.1em;
  background:linear-gradient(90deg,#ff3b6b,#ffd23d,#33ffa0,#3db4ff,#c46cff,#ff3b6b);background-size:200% 100%;animation:rb 2s linear infinite;box-shadow:0 0 60px rgba(255,255,255,.7);text-shadow:0 3px 10px #000}
@keyframes rb{to{background-position:200% 0}}
.rank-lbl{font-family:var(--f-lat);font-weight:700;font-size:30px;letter-spacing:.5em;color:#fff;text-shadow:0 0 20px #fff}
.rankslot{font-family:var(--f-lat);font-weight:900;font-size:300px;line-height:1;letter-spacing:.02em;
  background:linear-gradient(90deg,#ff3b6b,#ffd23d,#33ffa0,#3db4ff,#c46cff,#ff3b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,255,255,.8));animation:rb .6s linear infinite}
.rankslot.final{animation:rb .6s linear infinite,slam .45s cubic-bezier(.2,1.8,.4,1) both}
.rank-bar{width:900px;height:16px;border:2px solid #fff;padding:2px}
.rank-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b6b,#ffd23d,#33ffa0,#3db4ff,#c46cff)}
.rank-bar.err{border-color:#ff2040;box-shadow:0 0 30px #ff2040}
.rank-bar.err i{background:#ff2040}

/* 결과 화면 */
.rv{position:absolute;inset:0;--c:#fff}
.rv-no{position:absolute;left:96px;top:72px;font-family:var(--f-lat);font-weight:700;font-size:22px;letter-spacing:.3em;color:rgba(255,255,255,.55);animation:fadeIn .6s .2s both}
.rv-halo{position:absolute;left:880px;top:60px;width:860px;height:860px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent) 0%,transparent 62%);animation:fadeIn 1s both}
.rv-ring{position:absolute;left:960px;top:140px;width:700px;height:700px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);animation:spinR 30s linear infinite,fadeIn 1s .2s both;will-change:transform}
.rv-ring.b{left:1010px;top:190px;width:600px;height:600px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);animation:spinR 40s linear infinite reverse,fadeIn 1s .3s both}
@keyframes spinR{to{transform:rotate(360deg)}}
.rv-art{position:absolute;left:1010px;top:190px;width:600px;height:600px;animation:artIn .9s cubic-bezier(.2,1.2,.3,1) both}
.rv-art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 30px var(--c)) drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:float 4s ease-in-out .9s infinite;will-change:transform}
@keyframes artIn{from{transform:scale(1.5);opacity:0;filter:blur(30px) brightness(3)}to{transform:none;opacity:1;filter:none}}
@keyframes float{50%{transform:translateY(-18px)}}
.rv-info{position:absolute;left:150px;top:560px;width:860px;display:flex;flex-direction:column;gap:18px}
.rv-tier{display:flex;align-items:center;gap:18px;font-family:var(--f-lat);font-weight:700;font-size:32px;letter-spacing:.3em;color:var(--c);text-shadow:0 0 20px var(--c);animation:slideIn .5s .35s both}
.rv-tier .gem{width:18px;height:18px}
.rv-line{height:2px;width:620px;background:linear-gradient(90deg,var(--c),transparent);animation:grow .7s .4s both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.rv-name{font-family:var(--f-ser);font-weight:900;font-size:124px;line-height:1.08;color:#fff;letter-spacing:.02em;text-wrap:balance;

<script>

const CATS=[
  {id:'p1',rank:'1등',label:'1등',name:'PSI 입사키트',qty:1,w:1,tier:'SSR',art:'kit',sub:'PSI 정보구출반에 오신 것을 환영합니다.',seal:'입사 승인'},
  {id:'pq',rank:'?등',label:'?',name:'투명드래곤',qty:1,w:1.2,tier:'X',hidden:true},
  {id:'p2',rank:'2등',label:'2등',name:'명품선물',qty:1,w:2,tier:'SR',art:'gift',sub:'아무나 받을 수 없는 물건입니다.',seal:'기밀 해제'},
  {id:'p3',rank:'3등',label:'3등',name:'■■■ 인형',qty:1,w:3,tier:'SR',art:'doll',sub:'정체는 수령 후 공개됩니다.',seal:'기밀 해제'},
  {id:'p4',rank:'4등',label:'4등',name:'명찰',qty:4,w:5,tier:'R',art:'tag',sub:'오늘부터 정식 사원증입니다.'},
  {id:'p5',rank:'5등',label:'5등',name:'카마도 탄지로',qty:3,w:6,tier:'R',art:'film'},
  {id:'p6',rank:'6등',label:'6등',name:'마라본색 굿즈',qty:3,w:6,tier:'R',art:'mala',sub:'송천동 마라본색 공식 굿즈입니다.'},

];
const BY=Object.fromEntries(CATS.map(c=>[c.id,c]));
const TOTAL=CATS.reduce((s,c)=>s+c.qty,0);
const ORDER=['px','p5','p1','p6','px','p4','p3','pe','p6','px','p2','p5','pq','p4'];
const PIECES={};ORDER.forEach(id=>PIECES[id]=(PIECES[id]||0)+1);
const SLICE=(()=>{let r=0;return ORDER.map(id=>{const t=BY[id].tier;
  if(t==='R')return (r++%2)?{a:'#2a2124',b:'#0b0708',t:'#f3e3c0'}:{a:'#d21d36',b:'#7a0a1a',t:'#fff1d6'};
  if(t==='N')return {a:'#3a3640',b:'#18161c',t:'#a8a4b2'};
  if(t==='SR')return {a:'#7d34d6',b:'#3a0f72',t:'#f4e6ff'};
  if(t==='SSR')return {a:'#fff0b0',b:'#c8891c',t:'#3b1d00'};
  return {a:'#16b56c',b:'#05592f',t:'#eafff3'};})})();
const MISS_LINES=['보고서가 반려되었습니다.','결재 라인에서 누락되었습니다.','팀장님이 못 본 척 지나갔습니다.','이상현상 없음. 오늘도 평화롭습니다.'];
const KEY='psi-casino-v3';

let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.history))S={history:[],rot:0,ballL:-Math.PI/2+.3,sound:true};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const remaining=id=>BY[id].qty-S.history.filter(h=>h===id).length;
const leftCount=()=>TOTAL-S.history.length;
const DRAGON_UNLOCK=8;
function weightOf(c){
  const n=remaining(c.id);if(!n)return 0;
  const h=S.history,left=leftCount();let w=c.w*n;
  if(c.id==='p5'){ // 탄지로: 연속 금지, 사이사이 감초처럼
    const last=h.lastIndexOf('p5'),since=last<0?99:h.length-1-last,others=left-n;
    if(others>0&&since<3&&left>n*3)return 0;
    if(since===0&&others>0)return 0;
    if(last>=0&&since>=5)w*=1.6;
    if(left<=n*3)w*=4;
  }
  if(c.id==='pq'){ // 투명드래곤: 중후반 등장
    if(h.length<DRAGON_UNLOCK&&left>1)return 0;
    w*=1+(h.length-DRAGON_UNLOCK)*.3;
    if(left<=3)w*=6;
  }
  return w;
}
function probs(){const r={};let sum=0;CATS.forEach(c=>{r[c.id]=weightOf(c);sum+=r[c.id]});CATS.forEach(c=>r[c.id]=sum?r[c.id]/sum:0);return r}
const targetSizes=()=>{const p=probs();return ORDER.map(id=>p[id]/PIECES[id]*TAU)};
let disp=targetSizes();
const mod=a=>((a%TAU)+TAU)%TAU;
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut3=t=>1-Math.pow(1-t,3), eInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* ================= 화면 맞춤 ================= */
const stage=$('#stage');let K=1,DPR=1;const glc=$('#glint'),gx=glc.getContext('2d');
const bgc=$('#bg'),bx=bgc.getContext('2d'),wc=$('#wheel'),wx=wc.getContext('2d'),fxc=$('#fxc'),fx=fxc.getContext('2d');
let rotorCv=document.createElement('canvas'),bowlCv=document.createElement('canvas'),lightCv=document.createElement('canvas');

function fit(){
  K=Math.min(innerWidth/SW,innerHeight/SH);DPR=Math.min(2,window.devicePixelRatio||1);
  stage.style.transform=`translate(${(innerWidth-SW*K)/2}px,${(innerHeight-SH*K)/2}px) scale(${K})`;
  const q=Math.max(.5,Math.min(2,K*DPR));
  const qb=Math.min(.6,q),qf=Math.min(.8,q);RBG=null;bgc.width=SW*qb;bgc.height=SH*qb;fxc.width=SW*qf;fxc.height=SH*qf;glc.width=SW*qf;glc.height=SH*qf;
  const wp=Math.round(1060*Math.min(1.6,K*DPR*1.1));

/* ================= 2D 룰렛 레이어 (컷씬 소용돌이 + 대체 화면) ================= */
const RF={num:.80,pocket:.70,cone:.58,ballTrack:.925,ballPocket:.645};
function grain(g,R,r0,r1,n){for(let i=0;i<n;i++){const r=R*(r0+Math.random()*(r1-r0)),s=Math.random()*TAU;
  g.strokeStyle=Math.random()<.5?`rgba(255,200,150,${Math.random()*.07})`:`rgba(0,0,0,${Math.random()*.12})`;g.lineWidth=R*(.001+Math.random()*.004);
  g.beginPath();g.arc(0,0,r,s,s+Math.random()*2.5+.3);g.stroke()}}
function goldRing(g,r,w){const gr=g.createLinearGradient(-r,-r,r,r);gr.addColorStop(0,'#fff3c4');gr.addColorStop(.35,'#d9a640');gr.addColorStop(.6,'#7a4c0a');gr.addColorStop(1,'#f3cf72');
  g.strokeStyle=gr;g.lineWidth=w;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke()}
function buildBowl(){
  const N=bowlCv.width,R=N/2,g=bowlCv.getContext('2d');g.clearRect(0,0,N,N);g.save();g.translate(R,R);
  let gr=g.createRadialGradient(0,0,R*.78,0,0,R);
  gr.addColorStop(0,'#1a0803');gr.addColorStop(.12,'#3b1808');gr.addColorStop(.42,'#8a4218');gr.addColorStop(.62,'#5a2509');gr.addColorStop(.8,'#2a0f04');gr.addColorStop(1,'#0d0402');

  goldRing(g,R*.985,R*.014);goldRing(g,R*.935,R*.01);goldRing(g,R*.803,R*.006);
  g.restore();
}
function buildLight(){
  const N=lightCv.width,R=N/2,g=lightCv.getContext('2d');g.clearRect(0,0,N,N);g.save();g.translate(R,R);

}
function drawSlices(g,R,inner,labelR,zone){
  let a=-Math.PI/2;const bounds=[];
  ORDER.forEach((id,k)=>{const sz=disp[k];if(sz<1e-4)return;const s=SLICE[k];
    g.beginPath();g.arc(0,0,R,a,a+sz);g.arc(0,0,R*inner,a+sz,a,true);g.closePath();
    const gr=g.createRadialGradient(0,0,R*inner,0,0,R);gr.addColorStop(0,s.b);gr.addColorStop(.5,s.a);gr.addColorStop(.56,s.b);gr.addColorStop(1,s.a);
    g.fillStyle=gr;g.fill();bounds.push(a);
    const mid=a+sz/2,rr=R*labelR,arc=rr*sz,lb=BY[id].label;
    g.save();g.fillStyle=s.t;g.textAlign='center';g.textBaseline='middle';g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=R*.008;
    let fs=Math.min(R*zone*.62,Math.max(R*.026,arc*.55));g.font=`900 ${fs}px "Noto Serif KR",serif`;
    if(g.measureText(lb).width<arc*.82){g.rotate(mid+Math.PI/2);g.translate(0,-rr)}
    else{fs=Math.min(R*zone*.5,Math.max(R*.026,arc*.78));g.font=`900 ${fs}px "Noto Serif KR",serif`;g.rotate(mid);g.translate(rr,0)}
    g.fillText(lb,0,0);g.restore();a+=sz});

}
function buildRotor(){
  const N=rotorCv.width,R=N/2,g=rotorCv.getContext('2d');g.clearRect(0,0,N,N);g.save();g.translate(R,R);
  const R1=R*RF.num,R3=R*RF.cone;

  b.forEach(x=>{g.save();g.rotate(x);g.fillStyle='#d9a640';g.fillRect(R3,-R*.004,R1-R3,R*.008);g.restore()});

function render3D(dt,now){

  if(camMode==='idle'){const az=.1+.05*Math.sin(now/5200),el=.72+.025*Math.sin(now/4100),d=4.8;
    tp=new T.Vector3(Math.sin(az)*Math.cos(el)*d,Math.sin(el)*d,Math.cos(az)*Math.cos(el)*d);tl=new T.Vector3(0,.02,0)}
  else if(camMode==='over'){tp=new T.Vector3(.15,2.35,1.45);tl=new T.Vector3(0,0,.05);tf=0;tfov=34;k=1.8}
  else if(camMode==='spin'){const prog=spinA?Math.min(1,spinA.vi/spinA.main.L.length):0,az=.5-prog*1.1,el=.62,d=3.9;
    tp=new T.Vector3(Math.sin(az)*Math.cos(el)*d,Math.sin(el)*d,Math.cos(az)*Math.cos(el)*d);tl=new T.Vector3(0,.02,0);tf=0;tfov=32;k=1.2}
  else{const p=g.ball.position,dir=new T.Vector3(p.x,0,p.z).normalize(),side=new T.Vector3(-dir.z,0,dir.x);
    tp=p.clone().add(dir.clone().multiplyScalar(.62)).add(side.multiplyScalar(.18)).add(new T.Vector3(0,.4,0));
    tl=p.clone().add(new T.Vector3(0,-.01,0));tf=0;tfov=34;k=4.5}

function cardLayout(n){

  for(let i=0;i<n;i++){const r=Math.floor(i/cols),inRow=r<rows-1?cols:n-cols*(rows-1),c=i-r*cols;
    pts.push({x:960+(c-(inRow-1)/2)*470*k,y:(rows>1?515:540)+(r-(rows-1)/2)*650*k})}
  return {k,pts}}

function pickCard(cards,done){return new Promise(res=>{
  const hs=cards.map((el,i)=>{const h=e=>{e.stopPropagation();fin(i)};el.addEventListener('pointerdown',h);return h});
  const k=e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();fin(cards.findIndex((_,i)=>!done.has(i)))}};
  addEventListener('keydown',k);
  function fin(i){if(i<0||done.has(i))return;cards.forEach((el,j)=>el.removeEventListener('pointerdown',hs[j]));removeEventListener('keydown',k);res(i)}
})}
function flyMulti(tiers,pts){return new Promise(res=>{
  const t0=performance.now(),dur=2000;
  const orbs=tiers.map((t,i)=>({x:-140,y:80+i*130,s:26,c:TC[t==='SSR'||t==='X'?'SR':t],plan:t==='SSR'?['SR','SSR']:t==='X'?['SR','SSR','X']:[t],idx:0,
    p0:{x:-140-(i%5)*90,y:60+(i%6)*90},p1:{x:400+i*70,y:-60+(i%4)*40},p2:pts[i],delay:Math.min(.4,i*.05)}));
  FX.orbs=orbs;SFX.whoosh(dur/1000);
  function step(now){const T0=(now-t0)/(reduce?400:dur);let done=true;
    for(const o of orbs){const t=Math.max(0,Math.min(1,(T0-o.delay)/(1-o.delay)));if(t<1)done=false;const e=eInOut(t),u=1-e;
      o.x=u*u*o.p0.x+2*u*e*o.p1.x+e*e*o.p2.x;o.y=u*u*o.p0.y+2*u*e*o.p1.y+e*e*o.p2.y;o.s=20+e*30;
      const cuts=o.plan.length===2?[.55]:o.plan.length===3?[.42,.72]:[];
      if(o.idx<cuts.length&&t>=cuts[o.idx]){o.idx++;const nc=o.plan[o.idx]==='X'?'rainbow':TC[o.plan[o.idx]];o.c=nc;ring(nc,o.x,o.y,16);burst('spark',50,nc,o.x,o.y,12);FX.flash=.35;SFX.shing()}}
    FX.zoom=.3+Math.min(1,T0)*1.6;
    if(!done)requestAnimationFrame(step);else{FX.orbs=[];res()}}
  requestAnimationFrame(step)})}

const SLOT_DEF={lobby:'B',tense:'duck',win:'A'},SLOT_VOL={lobby:.34,tense:.45,win:.5},DUCK_VOL=.12,SLOT_RESTART={lobby:false,tense:true,win:true};
if(!S.mslots||S.mver!==2){S.mslots={...(S.mslots||{}),...SLOT_DEF,lobby:(S.mslots&&S.mslots.lobby)||SLOT_DEF.lobby,win:(S.mslots&&S.mslots.win)||SLOT_DEF.win,tense:'duck'};S.mver=2}if(S.music===undefined)S.music=true;
const AUD={};for(const k in TRACKS){const a=new Audio();a.src=TRACKS[k].src;a.loop=true;a.preload='auto';a.volume=0;AUD[k]=a}
let curSlot=null,curKey=null;const FADES=new Map();
function fadeTo(a,v,ms,then){FADES.set(a,{from:a.volume,to:v,t0:performance.now(),ms,then})}
setInterval(()=>{const now=performance.now();FADES.forEach((f,a)=>{const k=Math.min(1,(now-f.t0)/Math.max(1,f.ms));
  try{a.volume=Math.max(0,Math.min(1,f.from+(f.to-f.from)*k))}catch(e){}if(k>=1){FADES.delete(a);f.then&&f.then()}})},30);
function music(slot,ms=900){
  curSlot=slot;
  let key=slot&&S.music?S.mslots[slot]:null,vol=slot?SLOT_VOL[slot]:0,restart=slot?SLOT_RESTART[slot]:false;
  if(key==='duck'){key=S.mslots.lobby;vol=DUCK_VOL;restart=false}
  const el=key&&AUD[key]?AUD[key]:null;
  for(const k in AUD){const a=AUD[k];if(a!==el&&!a.paused)fadeTo(a,0,ms,()=>{if(AUD[curKey]!==a)a.pause()})}
  curKey=el?key:null;if(!el)return;
  if(el.paused){if(restart)try{el.currentTime=TRACKS[key].start}catch(e){}
    el.volume=0;const pr=el.play();if(pr&&pr.catch)pr.catch(()=>{})}
  fadeTo(el,vol,ms);
}

function updateUI(){
  const p=probs(),left=leftCount();
  $('#rows').innerHTML=CATS.map(c=>{const n=remaining(c.id),v=p[c.id]*100;
    const lock=n&&p[c.id]===0?(c.id==='pq'?'봉인 중':'쿨타임'):'';
    return `<div class="orow ${n?'':'out'}"><span class="gem" style="--c:${TC[c.tier]}"></span><span class="rk">${c.rank}</span><span class="ld"></span><span class="pc ${lock?'lock':''}">${n?(lock||v.toFixed(1)+'<small>%</small>'):'—'}</span></div>`}).join('');
  const b=$('#pull');b.disabled=busy||!left;const N=multiN();$('#pull3').disabled=busy||left<2;$('#multiT').textContent=`${N}회 뽑기`;$('#multiS').textContent=`${N} PULLS`;
  $('#nMinus').disabled=busy||N<=2;$('#nPlus').disabled=busy||N>=Math.min(10,left);if(document.activeElement!==$('#nInput'))$('#nInput').value=N;$('#nInput').disabled=busy;
  b.querySelector('.t').textContent=left?'뽑기':'완료';
  $('#left').textContent=`${left} / ${TOTAL} LEFT`;
  $('#undo').disabled=busy||!S.history.length;$('#reset').disabled=busy;$('#resetBtn').disabled=busy||!S.history.length;
  $('#snd').innerHTML=`효과음 ${S.sound?'켜짐':'꺼짐'} <small>M</small>`;
}
function confirmBox(title,sub,yes,onYes){
  const m=$('#modal');m.innerHTML=`<div class="mbox"><h2>${title}</h2><p>${sub}</p><div class="mbtns"><button id="mNo">그만두기</button><button class="y" id="mYes">${yes}</button></div></div>`;
  m.hidden=false;$('#mNo').onclick=()=>m.hidden=true;$('#mYes').onclick=()=>{m.hidden=true;onYes()};$('#mYes').focus();
}
const undo=()=>{if(busy)return;const h=S.history[S.history.length-1];if(!h)return;$('#menu').hidden=true;
  confirmBox(`${S.history.length}번 결과(${BY[h].rank})를 취소할까요?`,'상품이 룰렛으로 돌아가고 남은 기회가 하나 늘어납니다.','취소하기',()=>{S.history.pop();save();updateUI()})};
const reset=()=>{if(busy)return;$('#menu').hidden=true;
  confirmBox('처음부터 다시 할까요?','모든 기록이 지워지고 상품이 전부 룰렛으로 돌아갑니다.','처음부터',()=>{S.history=[];save();updateUI()})};
const toggleSnd=()=>{S.sound=!S.sound;save();updateUI()};
function multiN(){const left=leftCount(),mx=Math.max(2,Math.min(10,left));let n=parseInt(S.multiN||3,10);if(!isFinite(n))n=3;return Math.max(2,Math.min(mx,n))}
$('#pull').onclick=()=>spin(1);$('#pull3').onclick=()=>{const n=Math.min(multiN(),leftCount());if(n>=2)spin(n)};
$('#nMinus').onclick=()=>{S.multiN=multiN()-1;save();updateUI()};
$('#nPlus').onclick=()=>{S.multiN=multiN()+1;save();updateUI()};
$('#nInput').onchange=()=>{S.multiN=parseInt($('#nInput').value,10)||3;save();$('#nInput').blur();updateUI()};
$('#nInput').onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')$('#nInput').onchange()};
$('#gear').onclick=()=>{$('#menu').hidden=!$('#menu').hidden};
$('#undo').onclick=undo;$('#reset').onclick=reset;
$('#mus').onclick=()=>{S.music=!S.music;save();$('#mus').textContent=S.music?'음악 켜짐':'음악 꺼짐';music(curSlot||'lobby',500)};
$('#mus').textContent=S.music?'음악 켜짐':'음악 꺼짐';
['lobby','tense','win'].forEach(sl=>{const sel=$('#m-'+sl);
  sel.innerHTML=(sl==='tense'?'<option value="duck">대기 곡 작게</option>':'')+Object.keys(TRACKS).map(k=>`<option value="${k}">${TRACKS[k].label}</option>`).join('')+'<option value="off">없음</option>';
  sel.value=S.mslots[sl]||'off';sel.onchange=()=>{S.mslots[sl]=sel.value;save();if(curSlot===sl)music(sl,400)}});$('#resetBtn').onclick=reset;$('#snd').onclick=toggleSnd;
addEventListener('keydown',e=>{
  if(!cut.hidden||!$('#modal').hidden)return;
  if(e.code==='Space'&&!busy&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();spin(1)}
  else if(e.code==='Enter'&&!busy&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='INPUT'){const n=Math.min(multiN(),leftCount());if(n>=2)spin(n)}
  else if(e.code==='KeyZ')undo();else if(e.code==='KeyR')reset();else if(e.code==='KeyM')toggleSnd();
});

G=init3D();
if(!G){$('#gl').hidden=true;$('#persp').hidden=false}
addEventListener('resize',fit);
fit();updateUI();if(G)update3DSlices();
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(()=>{rotorDirty=true;if(G){update3DSlices();}});
</script>

</body>
</html>
