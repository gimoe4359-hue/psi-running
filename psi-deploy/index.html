<!doctype html>
<html lang="ko">
<head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>싸이뛰어! — PSI 정보구출반 연성 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f6fb;--card:#ffffff;--ink:#0e1b3d;--ink-2:#42507a;--line:#cfd7ea;
  --blue:#2f5bff;--on-blue:#ffffff;--yellow:#ffd23f;--red:#e5384b;--dusk:#7f8db5;--soft:#e8edfb;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR','Batang','Nanum Myeongjo',serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0b1226;--card:#121b38;--ink:#eef2ff;--ink-2:#a9b6de;--line:#26335c;--blue:#7d9bff;--on-blue:#0b1226;--red:#ff7a87;--dusk:#8b97c2;--soft:#18244a}
}
:root[data-theme="dark"]{--paper:#0b1226;--card:#121b38;--ink:#eef2ff;--ink-2:#a9b6de;--line:#26335c;--blue:#7d9bff;--on-blue:#0b1226;--red:#ff7a87;--dusk:#8b97c2;--soft:#18244a}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 16px;z-index:100;border-radius:6px}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ── header ── */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
#top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.badge{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.badge .tag{width:46px;height:46px;border-radius:12px;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;position:relative;flex:none}
.badge .tag::before{content:'';position:absolute;top:-6px;left:50%;width:16px;height:6px;margin-left:-8px;border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;background:var(--paper)}
.badge .tag svg{width:34px;height:34px}
.badge b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.01em;line-height:1}
.badge small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.02em;margin-top:2px}
#top nav{margin-left:auto;display:flex;gap:2px;align-items:center}
nav a.nl{font-weight:600;text-decoration:none;color:var(--ink);padding:9px 15px;border-radius:999px;border:2px solid transparent;white-space:nowrap}
nav a.nl:hover{border-color:var(--line)}
nav a.nl[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tbtn{margin-left:8px;background:transparent;border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--ink);color:var(--ink)}

/* ── ticker ── */
.ticker{background:var(--yellow);color:#0e1b3d;border-bottom:2px solid var(--ink);overflow:hidden;position:relative}
.ticker .row{display:flex;align-items:center;gap:12px;height:38px}
.ticker .lab{flex:none;background:#0e1b3d;color:#ffd23f;font-weight:700;font-size:13px;padding:5px 12px;border-radius:0 999px 999px 0;margin-right:4px;white-space:nowrap}
.ticker .clip{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .track{display:inline-block;padding-left:100%;animation:tick 46s linear infinite;font-weight:500;font-size:15px}
.ticker .track span{margin-right:44px}
.ticker.paused .track{animation-play-state:paused}
.ticker .pz{flex:none;border:2px solid #0e1b3d;background:transparent;color:#0e1b3d;border-radius:999px;width:28px;height:28px;font-size:11px;line-height:1;margin-right:14px}
@keyframes tick{to{transform:translateX(-100%)}}

/* ── hero / home ── */
.hero{padding:56px 0 40px}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,8.2vw,96px);line-height:1;margin:0 0 18px;letter-spacing:-.01em;white-space:nowrap}
.hero h1 .run{display:inline-block;width:.78em;height:.78em;vertical-align:-.06em;margin-left:.08em}
.hero .lead{font-size:clamp(19px,2.2vw,23px);line-height:1.6;margin:0 0 14px;font-weight:600;max-width:34ch;text-wrap:balance}
.hero p.sub{color:var(--ink-2);margin:0 0 26px;max-width:44ch;text-wrap:pretty}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:12px;border:2px solid var(--ink);font-weight:700;text-decoration:none;background:var(--card);color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.sm{padding:8px 16px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero-art{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 0 rgba(14,27,61,.06))}
.ticket-run{animation:bob 1.4s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.rf1{animation:rf .5s steps(1) infinite}
.rf2{animation:rf .5s steps(1) infinite reverse}
@keyframes rf{0%{opacity:1}50%{opacity:0}}
section.blk{padding:36px 0}
h2.sec,.phead h1{text-wrap:balance}
h2.sec{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,42px);margin:0 0 6px;line-height:1.15}
p.sec-sub{color:var(--ink-2);margin:0 0 24px}
.memo{background:var(--card);border:2px solid var(--ink);border-radius:6px;position:relative;padding:28px 30px 26px}
.memo .stampr{position:absolute;right:22px;top:-16px;background:var(--red);color:#fff;font-family:var(--display);font-size:20px;padding:4px 16px;border-radius:6px;transform:rotate(3deg)}
.memo dl{display:grid;grid-template-columns:120px 1fr;gap:0;margin:0}
.memo dt{font-weight:700;color:var(--ink-2);padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.memo dd{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.memo dt:first-of-type,.memo dd:first-of-type{border-top:0}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.door{display:block;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:26px 24px 24px;position:relative;min-height:200px}
.door.n{background:var(--blue);color:var(--on-blue)}
.door.g{background:#1b2838;color:#c7d5e0}
.door.b{background:var(--yellow);color:#0e1b3d}
.door h3{font-family:var(--display);font-weight:400;font-size:36px;margin:0 0 6px;line-height:1.1}
.door p{margin:0;max-width:30ch}
.door .stat{position:absolute;left:24px;bottom:18px;font-weight:600;font-size:15px}
.door .go{position:absolute;right:22px;bottom:14px;font-family:var(--display);font-size:30px}
.door:hover{transform:translateY(-3px)}

/* ── page head / shared ── */
.phead{padding:44px 0 20px;border-bottom:2px solid var(--ink);margin-bottom:28px}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,68px);margin:0;line-height:1.05}
.phead p{margin:8px 0 0;color:var(--ink-2);max-width:60ch}
.stamp{font-family:var(--display);font-size:16px;color:var(--red);border:2px solid var(--red);padding:0 10px;border-radius:5px;transform:rotate(-3deg);display:inline-block;margin-left:8px;vertical-align:middle;line-height:1.5}
.chip{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.empty{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--ink-2)}
.crumb{font-size:14px;margin:0 0 8px}

/* ── novels: list (웹소설 플랫폼식) ── */
.tabs{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;font-weight:600;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:26px 20px}
.ncard{text-decoration:none;color:var(--ink);display:block}
.ncover{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#000;border:2px solid var(--ink);display:grid;place-items:center}
.ncover img{width:100%;height:auto;display:block}
.ncover .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#ffd23f;font-family:var(--display);font-size:22px;line-height:1.2}
.ncover .bd{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.bd i{font-style:normal;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;background:#ffd23f;color:#0e1b3d}
.bd i.up{background:var(--red);color:#fff}
.ncard:hover .ncover{transform:translateY(-3px)}
.ncard h3{font-size:16px;font-weight:700;margin:10px 0 2px;line-height:1.35}
.ncard p{margin:0;font-size:13px;color:var(--ink-2)}

/* ── novels: detail ── */
.nhero{position:relative;overflow:hidden;border-bottom:2px solid var(--ink);background:#000;color:#fff}
.nhero .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(22px) brightness(.5);transform:scale(1.1)}
.nhero .in{position:relative;display:flex;gap:26px;align-items:flex-end;padding:34px 0 28px}
.nhero .ncover{width:170px;flex:none;border-color:#fff}
.nhero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0 0 6px;line-height:1.15}
.nhero .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.nhero .tags span{font-size:13px;padding:1px 9px;border:1px solid rgba(255,255,255,.55);border-radius:999px}
.nhero .sum{margin:0 0 14px;color:#e8ecf7;max-width:60ch}
.nhero .meta{font-size:14px;color:#c9d1ea;margin:0 0 14px}
.nact{display:flex;gap:10px;flex-wrap:wrap}
.nact .btn{border-color:#fff}
.nact .btn.pri{background:#ffd23f;color:#0e1b3d;border-color:#ffd23f}
.nact .btn.ghost{background:transparent;color:#fff}
.eplist-h{display:flex;align-items:center;justify-content:space-between;padding:22px 0 10px}
.eplist-h b{font-size:18px}
.eplist-h button{background:none;border:0;color:var(--ink-2);font-size:14px;font-weight:600}
.eps{list-style:none;margin:0 0 30px;padding:0;border-top:2px solid var(--ink)}
.eps a{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.eps a:hover{background:var(--soft)}
.eps .th{width:64px;height:64px;border-radius:8px;background:#000 center/cover;border:1px solid var(--line)}
.eps .t{font-weight:600;line-height:1.35}
.eps .d{font-size:13px;color:var(--ink-2)}
.eps .fr{font-size:12px;font-weight:700;color:#0a8a4a;border:1px solid #0a8a4a;border-radius:4px;padding:0 6px;margin-right:6px}
.eps li.read .t,.eps li.read .th{opacity:.5}
.eps .go{font-size:13px;color:var(--ink-2);text-align:right}

/* ── viewer (카카오페이지식 뷰어) ── */
body.viewer #top,body.viewer .ticker,body.viewer footer{display:none}
body.viewer{overflow:hidden}
.vw{--vbg:#fff;--vink:#1c1c1c;--vsub:#8a8a8a;--vline:#e6e6e6;--vbar:rgba(255,255,255,.96);
  position:fixed;inset:0;z-index:80;background:var(--vbg);color:var(--vink);
  --vs:19px;--vl:1.95;--vf:var(--serif);--pad:max(22px,calc((100vw - 680px)/2))}
.vw[data-vt="paper"]{--vbg:#f2ead8;--vink:#3a3226;--vsub:#8d8067;--vline:#dccfb2;--vbar:rgba(242,234,216,.96)}
.vw[data-vt="gray"]{--vbg:#2b2d31;--vink:#cfd1d6;--vsub:#8b8e96;--vline:#3a3d43;--vbar:rgba(43,45,49,.96)}
.vw[data-vt="black"]{--vbg:#000;--vink:#b9b9b9;--vsub:#777;--vline:#222;--vbar:rgba(0,0,0,.96)}
.vw[data-vf="sans"]{--vf:var(--body)}
.vbody{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.vin{max-width:680px;margin:0 auto;padding:88px 22px 150px;font-family:var(--vf);font-size:var(--vs);line-height:var(--vl)}
.vin h1{font-family:var(--display);font-weight:400;font-size:1.55em;line-height:1.3;margin:0 0 6px}
.vin .cm{font-family:var(--body);font-size:.7em;color:var(--vsub);margin:0 0 32px}
.vin p{margin:0 0 1.2em;word-break:keep-all;overflow-wrap:anywhere}
.vin h3{font-family:var(--body);font-size:.95em;font-weight:700;margin:1.6em 0 .5em;padding-left:10px;border-left:4px solid #ffd23f}
.vin hr{border:0;border-top:1px solid var(--vline);margin:1.6em 0}
.vend{text-align:center;padding:26px 0 0}
.vend .btn{width:100%;max-width:340px;background:#ffd23f;color:#0e1b3d;border-color:#ffd23f}
.vend .btn.ghost{background:transparent;color:var(--vink);border-color:var(--vline);margin-top:10px}
.vtop,.vbot{position:fixed;left:0;right:0;z-index:5;background:var(--vbar);transition:transform .22s;backdrop-filter:blur(6px)}
.vtop{top:0;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--vline)}
.vbot{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--vline)}
.vw.hide .vtop{transform:translateY(-101%)}
.vw.hide .vbot{transform:translateY(101%)}
.vrow{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;max-width:760px;margin:0 auto}
.vrow .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .ttl small{display:block;font-size:11px;color:var(--vsub);font-weight:400;line-height:1.2}
.vb{background:none;border:0;color:var(--vink);font-size:15px;font-weight:600;padding:8px 12px;border-radius:8px;text-decoration:none;white-space:nowrap}
.vb:hover{background:rgba(127,127,127,.15)}
.vb[disabled],.vb.off{opacity:.3;pointer-events:none}
.vprog{height:3px;background:var(--vline)}
.vprog i{display:block;height:100%;width:0;background:#ffd23f}
.vset{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--vbg);border-top:1px solid var(--vline);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 30px rgba(0,0,0,.18);transform:translateY(102%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
.vset.on{transform:none;visibility:visible;transition:transform .22s}
.vset .in{max-width:520px;margin:0 auto;display:grid;gap:14px}
.vset .r{display:flex;align-items:center;gap:12px}
.vset .r>span{width:74px;font-size:14px;color:var(--vsub);flex:none}
.vset .g{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.vset .g button{flex:1;min-width:52px;padding:7px 8px;border:2px solid var(--vline);background:transparent;border-radius:8px;font-size:14px;font-weight:600;color:var(--vink)}
.vset .g button[aria-pressed="true"]{border-color:#ffd23f;background:rgba(255,210,63,.18)}
.vset .g button.sw{flex:none;min-width:40px;width:40px;height:40px;border-radius:50%;padding:0}
.vset .x{justify-self:end;background:none;border:0;color:var(--vsub);font-size:14px;text-decoration:underline}
.vw[data-vm="page"] .vbody{overflow:hidden}
.vw[data-vm="page"] .vin{position:absolute;top:64px;bottom:64px;left:var(--pad);width:calc(100vw - 2 * var(--pad));max-width:none;margin:0;padding:0;column-width:calc(100vw - 2 * var(--pad));column-gap:calc(2 * var(--pad));column-fill:auto;transition:transform .28s}
.vw[data-vm="page"] .vend{break-inside:avoid}
.vpg{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center;font-size:12px;color:var(--vsub);pointer-events:none;z-index:4}
.vw:not([data-vm="page"]) .vpg{display:none}

/* ── games (스팀 스타일) ── */
.steam{background:#1b2838;color:#c7d5e0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:0 0 60px;--sb:#66c0f4;--sd:#16202d;--sdd:#0e141b}
.steam a{color:#66c0f4}
.sbar{background:#171a21;border-bottom:1px solid #000;padding:12px 0;color:#c6d4df}
.sbar .wrap{display:flex;align-items:center;gap:18px}
.sbar b{font-family:var(--display);font-weight:400;font-size:22px;color:#fff;letter-spacing:.02em}
.sbar span{font-size:13px;color:#8f98a0}
.sbar input{margin-left:auto;background:#316282;color:#fff;border:1px solid #000;border-radius:3px;padding:6px 10px;min-width:180px;font-size:14px}
.sbar input::placeholder{color:#a5c4d8}
.slay{display:grid;grid-template-columns:270px 1fr;gap:26px;padding-top:26px}
.slib{background:#16202d;border:1px solid #0e141b;align-self:start;max-height:640px;overflow:auto}
.slib h4{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.06em;color:#8f98a0;background:#0e141b;font-weight:600}
.slib a{display:flex;gap:10px;align-items:center;padding:8px 12px;text-decoration:none;color:#c7d5e0;font-size:14px;border-left:3px solid transparent}
.slib a:hover{background:#243447}
.slib a[aria-current="true"]{background:#3d4450;border-left-color:#66c0f4;color:#fff}
.slib .ic{width:34px;height:34px;flex:none;border-radius:3px;overflow:hidden}
.slib .ic svg{width:100%;height:100%;display:block}
.smain h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);color:#fff;margin:0 0 14px;line-height:1.2}
.shead{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-bottom:22px}
.scap{border:1px solid #000;box-shadow:0 0 18px rgba(0,0,0,.5);background:#000;aspect-ratio:460/215;overflow:hidden}
.scap svg{width:100%;height:100%;display:block}
.scap.vid{aspect-ratio:16/9}
.scap.vid a{display:block;height:100%}
.scap video{width:100%;height:100%;object-fit:cover;display:block}
.slib .ic img{width:100%;height:100%;object-fit:cover;display:block}
.sinfo{background:#16202d;padding:14px 16px;font-size:13px;line-height:1.55;display:grid;gap:10px;align-content:start}
.sinfo .row{display:grid;grid-template-columns:78px 1fr;gap:8px}
.sinfo .k{color:#8f98a0;font-size:12px;padding-top:1px}
.sinfo .desc{font-size:13px;color:#acb2b8;margin:0}
.stags{display:flex;flex-wrap:wrap;gap:4px}
.stags span{background:rgba(103,193,245,.2);color:#67c1f5;padding:1px 8px;border-radius:2px;font-size:12px}
.splay{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(14,20,27,.9),rgba(14,20,27,.3));padding:14px 16px;margin-bottom:22px;border-left:4px solid #5c7e10}

    <div class="cbtnrow"><a class="cbtn" href="#/board/new">글쓰기</a></div>
    <div class="cpg" role="navigation" aria-label="페이지"><button type="button" data-pg="${bpage - 1}" ${bpage <= 1 ? 'disabled' : ''}>‹</button>${nums.map(n => `<button type="button" data-pg="${n}" ${n === bpage ? 'aria-current="true"' : ''}>${n}</button>`).join('')}<button type="button" data-pg="${bpage + 1}" ${bpage >= pages ? 'disabled' : ''}>›</button></div>
    <form class="csrch" id="cs"><select id="csf" aria-label="검색 범위"><option value="all" ${bqf === 'all' ? 'selected' : ''}>제목+내용</option><option value="title" ${bqf === 'title' ? 'selected' : ''}>제목만</option><option value="body" ${bqf === 'body' ? 'selected' : ''}>내용만</option></select><input id="csq" type="search" placeholder="검색어를 입력하세요" value="${esc(bq)}" aria-label="검색어"><button type="submit">검색</button></form>`, bcur);
  bindShell();
  $$('[data-pg]').forEach(b => b.addEventListener('click', () => { bpage = +b.dataset.pg; viewBoard(); window.scrollTo(0, 0); }));
  $('#cs').addEventListener('submit', e => { e.preventDefault(); bq = $('#csq').value.trim(); bqf = $('#csf').value; bpage = 1; viewBoard(); });
}

function viewPost(id) {
  const p = Board.get(id); if (!p) return notFound();
  Board.view(id);
  const order = []; p.comments.forEach(c => { if (c.author !== p.author && !order.includes(c.author)) order.push(c.author); });
  const nick = a => a === p.author ? '<b class="op">글쓴이</b>' : `<b>익명${order.indexOf(a) + 1}</b>`;
  const liked = p.likedBy.includes(dev), mine = p.author === dev;
  main.innerHTML = cafeShell(`
    <div class="cart-h"><a class="bn" href="#/board/c/${p.cat}">${esc(Cats.name(p.cat))} ›</a><h1>${p.pin ? '<span class="pn" style="font-size:12px;vertical-align:middle;margin-right:6px">공지</span>' : ''}${esc(p.title)}${p.sample ? ' <span class="chip">예시</span>' : ''}</h1>
      <div class="mt"><span>익명</span><span>${fdate(p.t)} ${cdate(p.t).includes(':') ? cdate(p.t) : ''}</span><span>조회 ${p.views || 0}</span><span>댓글 ${p.comments.length}</span></div></div>
    <div class="cart-b">${esc(p.body)}</div>
    <div class="cart-a"><button class="lk" type="button" id="plike" aria-pressed="${liked}">👍 좋아요 ${p.likes}</button><span class="sp"><a class="cbtn ln" href="#/board/c/${p.cat}">목록</a><a class="cbtn" href="#/board/new">글쓰기</a>${mine ? '<button class="cbtn ln" type="button" id="pdel">삭제</button>' : ''}</span></div>
    <div class="ccm"><h2>댓글 ${p.comments.length}</h2>
      <ul>${p.comments.map(c => `<li><div class="m">${nick(c.author)}<span>${cdate(c.t)}</span></div><p>${esc(c.body)}</p></li>`).join('') || '<li style="color:var(--ink-2);font-size:14px">첫 댓글을 남겨 보세요.</li>'}</ul>
      <form class="ccf" id="cf"><textarea maxlength="300" placeholder="익명으로 댓글을 남겨 보세요." aria-label="댓글"></textarea><div class="r"><span>익명으로 등록됩니다</span><button class="cbtn" type="submit">등록</button></div></form></div>`, p.cat);
  bindShell();
  $('#plike').addEventListener('click', () => { Board.like(id); viewPost(id); });
  const d = $('#pdel'); if (d) d.addEventListener('click', () => { if (confirm('이 글을 삭제할까요?')) { Board.del(id); toast('글을 삭제했어요.'); location.hash = '#/board'; } });
  $('#cf').addEventListener('submit', e => { e.preventDefault(); const t = $('textarea', e.target).value.trim(); if (!t) { toast('댓글 내용을 입력해 주세요.'); return; } Board.comment(id, t.slice(0, 300)); viewPost(id); });
}
let lastPost = 0;
function viewWrite() {
  const cats = Cats.all(), def = cats.some(c => c.id === bcur) ? bcur : (cats.find(c => c.id === 'free') || cats[0]).id;
  main.innerHTML = cafeShell(`
    <div class="ctb"><h1>글쓰기</h1><span>익명으로 등록됩니다</span></div>
    <form class="cwf" id="wf" novalidate style="margin-top:14px"><div><label for="wc">게시판</label><select id="wc">${cats.map(c => `<option value="${c.id}" ${c.id === def ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label for="wt">제목</label><input id="wt" type="text" maxlength="60" placeholder="제목을 입력하세요"></div>
      <div><label for="wb">내용</label><textarea id="wb" maxlength="2000" placeholder="익명으로 자유롭게 적어 주세요. 다른 사람이 상처받을 글은 삼가 주세요."></textarea></div>
      <div class="r"><label class="chk"><input type="checkbox" id="wp"> 공지로 등록</label><span><a class="cbtn ln" href="#/board">취소</a> <button class="cbtn" type="submit">등록</button></span></div></form>`, 'write');
  bindShell();
  $('#wf').addEventListener('submit', e => {
    e.preventDefault(); const t = $('#wt').value.trim(), b = $('#wb').value.trim();
    if (t.length < 2) { toast('제목을 두 글자 이상 적어 주세요.'); $('#wt').focus(); return; }
    if (b.length < 2) { toast('내용을 입력해 주세요.'); $('#wb').focus(); return; }
    if (Date.now() - lastPost < 8000) { toast('잠시 후 다시 등록해 주세요.'); return; }
    lastPost = Date.now();
    const id = Board.add({ cat: $('#wc').value, title: t.slice(0, 60), body: b.slice(0, 2000), pin: $('#wp').checked });
    toast('글이 등록되었습니다.'); location.hash = '#/board/' + id;
  });
}

/* 게시판(분류) 관리 — 추가 · 이름 바꾸기 · 순서 · 삭제 */
function openCatManager() {
  const wrap = document.createElement('div'); wrap.className = 'cmodal'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', '게시판 관리');
  const draw = () => {
    const l = Cats.all();
    wrap.innerHTML = `<div class="box"><h2>게시판 관리</h2><p class="sub">게시판 이름을 바꾸고, 순서를 옮기고, 새로 만들 수 있어요. (이 브라우저에 저장돼요)</p>
      ${l.map((c, i) => `<div class="row" data-id="${c.id}"><input type="text" value="${esc(c.name)}" maxlength="16" aria-label="게시판 이름"><button type="button" data-mv="-1" aria-label="위로" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-mv="1" aria-label="아래로" ${i === l.length - 1 ? 'disabled' : ''}>▼</button><button type="button" class="d" data-del aria-label="삭제" ${l.length <= 1 ? 'disabled' : ''}>✕</button></div>`).join('')}
      <div class="add"><input id="cnew" type="text" maxlength="16" placeholder="새 게시판 이름"><button class="cbtn" type="button" id="cadd">추가</button></div>
      <div class="foot"><button class="cbtn ln" type="button" id="cdone">닫기</button></div></div>`;
    $$('.row', wrap).forEach(r => {
      const id = r.dataset.id, inp = $('input', r);
      inp.addEventListener('change', () => { const v = inp.value.trim(); if (!v) { inp.value = Cats.name(id); return; } Cats.rename(id, v); });
      $$('[data-mv]', r).forEach(b => b.addEventListener('click', () => { Cats.move(id, +b.dataset.mv); draw(); }));
      $('[data-del]', r).addEventListener('click', () => { if (confirm('이 게시판을 삭제할까요? 안의 글은 첫 번째 게시판으로 옮겨져요.')) { if (Cats.del(id)) { if (bcur === id) bcur = 'all'; draw(); } } });
    });
    $('#cadd').addEventListener('click', () => {
      const v = $('#cnew').value.trim(); if (!v) { toast('게시판 이름을 입력해 주세요.'); return; }
      if (Cats.all().length >= 20) { toast('게시판은 최대 20개까지 만들 수 있어요.'); return; }
      if (Cats.all().some(c => c.name === v)) { toast('이미 있는 이름이에요.'); return; }
      Cats.add(v); draw(); const n = $('#cnew'); if (n) n.focus();
    });
    $('#cnew').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#cadd').click(); } });
    $('#cdone').addEventListener('click', close);
  };
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); route(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(wrap); draw();
}

function notFound() { main.innerHTML = `<div class="wrap"><div class="phead"><h1>찾을 수 없어요</h1><p>주소가 바뀌었거나 아직 없는 페이지예요. <a href="#/">홈으로 돌아가기</a></p></div></div>`; }

/* ---------- 라우터 ---------- */
function route() {
  window.onscroll = null; window.onkeydown = null; window.onresize = null;
  document.body.classList.remove('viewer');
  const p = location.hash.replace(/^#\/?/, '').split('/');
  let nav = 'home', keep = false;
  if (p[0] === 'novels') { nav = 'novels'; if (!p[1]) viewNovels(); else if (!p[2]) viewNovel(p[1]); else viewRead(p[1], parseInt(p[2], 10) || 1); }
  else if (p[0] === 'games') { nav = 'games'; viewGames(p[1]); }
  else if (p[0] === 'board') {
    nav = 'board';
    const setCur = c => { if (bcur !== c) { bcur = c; bpage = 1; bq = ''; } };
    if (!p[1]) { setCur('all'); viewBoard(); }
    else if (p[1] === 'hot') { setCur('hot'); viewBoard(); }
    else if (p[1] === 'c' && p[2]) { setCur(p[2]); viewBoard(); }
    else if (p[1] === 'new') viewWrite();
    else viewPost(p[1]);
  }
  else if (!p[0]) viewHome(); else notFound();
  $$('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
  if (p[0] !== 'novels' || !p[2]) main.focus({ preventScroll: true });
}
addEventListener('hashchange', route);

/* ---------- 속보 띠 / 화면 모드 ---------- */
$('#track').innerHTML = TICKER.concat(TICKER).map(t => `<span>${esc(t)}</span>`).join('');
$('#pz').addEventListener('click', () => { const t = $('#ticker'); t.classList.toggle('paused'); $('#pz').textContent = t.classList.contains('paused') ? '▶' : '❚❚'; });
const MODES = ['auto', 'light', 'dark'], MODE_LABEL = { auto: '자동', light: '라이트', dark: '다크' };
function applyMode(m) { const r = document.documentElement; if (m === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m); $('#themeBtn').textContent = '화면 모드: ' + MODE_LABEL[m]; }
let mode = LS.get('psi.mode', 'auto'); applyMode(mode);
$('#themeBtn').addEventListener('click', () => { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; LS.set('psi.mode', mode); applyMode(mode); });

route();
</script>
</body>
