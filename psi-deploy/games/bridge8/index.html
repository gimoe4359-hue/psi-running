<!DOCTYPE html>
<html lang="ko">
<head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%A8%3C/text%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>8번다리에는 무엇도 없었다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0203;--paper:#f6f2ea;--red:#ee0000;--red-d:#7a0000;--maroon:#3b0b0b;--maroon-l:#732b2b;--gray:#8a8a8a;
  --ui:'Nanum Gothic','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --hand:'Nanum Pen Script','Gaegu','Segoe Print',cursive;
  --disp:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
  --serif:'Nanum Myeongjo','Batang','Noto Serif KR',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0203}}
:root[data-theme="dark"]{--bg:#0b0203}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

#wrap{position:fixed;inset:0;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%;background:#000;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:1280px;height:720px}
.artbox{position:absolute;left:0;top:44px;width:1280px;height:592px;overflow:hidden}
svg.art{width:100%;height:100%;display:block}

.ln{stroke:#f6f2ea;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk{fill:#0b0203;stroke:#f6f2ea;stroke-width:3;stroke-linejoin:round}
.wh{fill:#f6f2ea}
.hs rect,.hs circle,.hs path,.hs ellipse,.hs polygon{fill:#fff;fill-opacity:0;stroke:none;cursor:pointer;transition:fill-opacity .12s}
.hs:hover rect,.hs:hover circle,.hs:hover path,.hs:hover ellipse,.hs:hover polygon{fill-opacity:.17}
.grab{cursor:grab;fill:#fff;fill-opacity:0}
.grab:hover{fill-opacity:.2}
.gr text{animation:gflick 6s infinite steps(1)}
.gr text:nth-child(4n){animation-delay:-2s}
.gr text:nth-child(7n){animation-delay:-4s}
@keyframes gflick{0%,92%,100%{opacity:.9}94%{opacity:.3}96%{opacity:.9}98%{opacity:.5}}
body.reduce .gr text{animation:none}
.cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(11,2,3,.88);border:2px solid var(--paper);padding:6px 16px;font-size:16px;white-space:nowrap;pointer-events:none;z-index:15;transition:opacity .15s}
#stage.dlg-open .cap{opacity:0}
#stage.dlg-open .pulse-t{opacity:0}
.pulse-t{animation:pt 1.6s infinite}
@keyframes pt{50%{opacity:.35}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.fall{animation:fall .7s ease-in forwards}
@keyframes fall{0%{transform:translateY(-60px) rotate(-2deg)}100%{transform:translateY(0) rotate(4deg)}}

.hud{position:absolute;left:0;width:1280px;background:var(--bg);z-index:20}
#hudTop{top:0;height:44px;border-bottom:2px solid var(--paper);display:flex;align-items:center;gap:8px;padding:0 10px}
#hudBot{top:636px;height:84px;border-top:2px solid var(--paper);display:flex;align-items:center;gap:14px;padding:0 14px}
.hbtn{background:var(--bg);color:var(--paper);border:2px solid var(--paper);padding:4px 12px;font-size:15px;font-weight:700}
.hbtn:hover{background:var(--red);border-color:var(--red)}
#mission{flex:1;text-align:center;font-size:15px;color:var(--paper);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission:not(:empty)::before{content:'MISSION';background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 6px;margin-right:10px;letter-spacing:.06em}
#inv{display:flex;gap:8px}
.slot{width:64px;height:64px;border:2px solid var(--maroon-l);background:#160305;display:flex;align-items:center;justify-content:center;position:relative}
.slot svg{width:52px;height:52px}
.slot[data-item]{cursor:pointer;border-color:var(--paper)}
.slot.sel{background:var(--red);border-color:#fff;box-shadow:0 0 0 3px #000,0 0 0 5px var(--red)}
.slot.new{animation:slotnew .8s}
@keyframes slotnew{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#invAct{display:flex;align-items:center;gap:10px;min-width:260px}
.ilabel{font-size:15px;font-weight:700}
.ilabel.dim{color:var(--gray);font-weight:400}

#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#flick{position:absolute;inset:0;background:#000;opacity:0}
#flick.on{opacity:.55}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s;pointer-events:none;z-index:70}
#fade.on{opacity:1;pointer-events:auto}
#ghost{position:absolute;font-family:var(--hand);color:var(--red-d);font-size:90px;opacity:0;z-index:31;pointer-events:none}
#ghost.on{animation:ghost 1.8s}
@keyframes ghost{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}

#tip{position:absolute;display:none;z-index:45;background:#0b0203;border:2px solid var(--paper);padding:3px 10px;font-size:14px;pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%) translateY(-12px);background:#0b0203;border:2px solid var(--paper);padding:8px 18px;font-size:16px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:900px;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#dlg{position:absolute;inset:0;z-index:60;cursor:pointer}
#dlg.black{background:#000}
#dlgbox{position:absolute;left:110px;right:110px;bottom:22px;min-height:132px;background:rgba(11,2,3,.94);border:3px solid var(--paper);padding:22px 30px 18px}
#dwho{position:absolute;left:24px;top:-18px;background:var(--red);color:#fff;font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--paper)}
#dtxt{font-size:22px;line-height:1.6;white-space:pre-wrap;min-height:70px}
#dnext{position:absolute;right:16px;bottom:8px;font-size:14px;color:var(--red);animation:pt 1s infinite}
#dlg.narr #dlgbox{background:transparent;border-color:transparent}
#dlg.narr #dtxt{text-align:center;font-style:italic;color:#e9e2d2}
#dlg.black #dlgbox{bottom:auto;top:50%;transform:translateY(-50%);background:transparent;border:none}
#dlg.black #dtxt{font-size:28px;text-align:center;font-style:normal}

#modal{position:absolute;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:center;justify-content:center}
.xbtn{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;border:3px solid var(--paper);font-size:18px;font-weight:800;line-height:1;z-index:3}

.nbwrap{position:relative}
.nb{position:relative;width:560px;height:440px;background:#efe6d0;color:#1c160b;border-left:26px solid var(--maroon);padding:34px 40px;font-family:var(--hand);font-size:38px;line-height:1.25;box-shadow:0 0 0 3px #000,0 0 0 6px var(--paper);transform:rotate(-1deg)}
.nb b{color:var(--red-d)}
.nb .big{font-size:64px;margin-top:6px}
.nb .pg{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:var(--ui);font-size:13px;color:#6a5c3c}
.nb .nav{position:absolute;bottom:8px;background:none;border:2px solid #1c160b;color:#1c160b;font-size:16px;padding:2px 12px}
.nb .prev{left:26px}.nb .next{right:26px}
.nb .scrib{color:var(--red-d)}

.paper{position:relative;width:660px;max-height:640px;overflow:auto;background:#e6d9bb;color:#1c160b;padding:22px 30px 26px;font-family:var(--serif);
  box-shadow:0 0 0 3px #000,0 0 0 6px var(--paper);transform:rotate(-.8deg);
  clip-path:polygon(0 1%,4% 0,12% 1.2%,22% 0,36% 1%,50% 0,63% 1.4%,80% 0,93% 1%,100% 0,100% 98%,92% 100%,76% 98.6%,60% 100%,44% 99%,27% 100%,12% 98.8%,0 100%)}
.paper .mast{font-size:34px;font-weight:800;border-bottom:4px double #1c160b;padding-bottom:4px;margin-bottom:12px;letter-spacing:.12em}
.paper h1{font-size:30px;line-height:1.25;margin:6px 0 12px}
.paper .cols{display:flex;gap:18px}
.paper .txt{flex:1;font-size:16px;line-height:1.85}
.paper .txt p{margin:0 0 10px}
.paper .bar{height:8px;background:#b9ab8a;margin:0 0 9px}
.paper .ph{width:210px;height:250px;flex:none;position:relative;background:radial-gradient(circle at 50% 38%,#8a7a58,#3b311c);overflow:hidden;filter:sepia(.5) contrast(1.1)}
.paper .ph small{position:absolute;bottom:4px;left:6px;right:6px;font-size:11px;color:#e6d9bb;line-height:1.3}
.paper .stain{position:absolute;left:35%;top:22%;width:90px;height:100px;border-radius:50%;background:rgba(40,10,6,.85);filter:blur(9px)}
.hlt{background:rgba(238,0,0,.18);padding:0 2px}

.phone{position:relative;width:340px;height:640px;background:#050102;border:3px solid var(--paper);border-radius:36px;padding:14px 10px;box-shadow:0 0 0 6px #000,0 0 70px rgba(238,0,0,.35)}
.pscr{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:#1a0507;color:var(--paper);display:flex;flex-direction:column}
.plock{height:100%;display:flex;flex-direction:column;align-items:center;padding-top:40px;background:linear-gradient(#4a0d0d,#0b0203)}
.ptime{font-size:56px;font-weight:300;letter-spacing:.02em}
.pdate{font-size:14px;color:#d9c9c0;margin-top:2px}
.pdots{display:flex;gap:16px;margin:34px 0 18px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);display:block}
.pdots i.f{background:var(--paper)}
.pdots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pkeys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pkeys button{height:60px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--paper);border:none;font-size:24px}
.pkeys button:active{background:var(--red)}
.pmsg{font-size:12px;color:#d9c9c0;margin-top:14px;min-height:16px}
.phome{height:100%;background:linear-gradient(160deg,#5a0d0d,#0b0203 70%);padding:34px 18px;position:relative}
.phome .ptime{font-size:40px;text-align:center}
.picons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;margin-top:40px}
.pic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;cursor:pointer;position:relative}
.pic i{width:52px;height:52px;border-radius:14px;background:#26090a;border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
.pic.msg i{background:var(--red)}
.pic b{position:absolute;top:-6px;right:2px;background:#fff;color:var(--red);font-size:11px;border-radius:9px;padding:0 6px;border:2px solid var(--red)}
.phead{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid #4a1a1c;font-weight:800;font-size:17px;flex:none}
.phead .bk2{background:none;border:none;color:var(--paper);font-size:20px;padding:0 6px}
.chip{margin-left:auto;font-size:12px;font-weight:700;background:var(--red);padding:3px 8px;border-radius:10px;white-space:nowrap}
.plist{overflow:auto;flex:1}
.pth{padding:12px 16px;border-bottom:1px solid #2e1113;cursor:pointer}
.pth:hover{background:#2a0c0e}
.pth .n{font-weight:800;font-size:14px;display:flex;justify-content:space-between}
.pth .n small{font-weight:400;color:#b8a49a;font-size:11px}
.pth .p{font-size:12px;color:#c9b6ac;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pthread{overflow:auto;flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:9px 11px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
.bub.in{align-self:flex-start;background:#2f1012;border-bottom-left-radius:3px}
.bub.out{align-self:flex-end;background:#a80000;border-bottom-right-radius:3px}
.bub.sys{align-self:center;background:none;color:#a8958a;font-size:11px;text-align:center}
.kw{cursor:pointer;border-radius:3px;transition:background .15s}
.kw:hover{background:rgba(238,0,0,.28)}
.kw.on{background:var(--red);color:#fff}

.desk{position:absolute;inset:0;background:radial-gradient(ellipse at 28% 30%,#5f0e0e 0,#2a0606 52%,#120203 100%);color:#fff;overflow:hidden}
.desk .wall{position:absolute;right:56px;top:60px;text-align:right;font-family:var(--disp);font-size:54px;line-height:1.05;color:rgba(255,255,255,.07);letter-spacing:.04em}

.tuner{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a0606,#0a0203 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:var(--paper)}
.tuner h3{font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.04em;margin:0}
.scope{width:520px;height:110px;background:#0b0203;border:2px solid var(--paper)}
.knobWrap{display:flex;align-items:center;gap:50px}
.knob{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a4a,#0b0203);border:4px solid var(--paper);position:relative;cursor:grab;touch-action:none}
.knob i{position:absolute;left:50%;top:10px;width:6px;height:52px;background:var(--red);margin-left:-3px;border-radius:3px;transform-origin:50% 65px;display:block}
.freqBox{font-family:monospace;font-size:38px;min-width:160px;text-align:center}
.freqBox b{color:var(--red)}
.lockmeter{width:400px;height:14px;background:#1a0507;border:2px solid var(--paper)}
.lockfill{height:100%;background:#5fe37a;transition:width .05s linear}
.filterRow{display:flex;align-items:center;gap:24px}
.ftrack{width:36px;height:220px;background:#1a0507;border:2px solid var(--paper);position:relative;touch-action:none;cursor:grab}
.ffill{position:absolute;bottom:0;left:0;right:0;background:var(--red)}
.fhandle{position:absolute;left:-8px;width:52px;height:22px;background:var(--paper);pointer-events:none}
.tuner .hintline{font-size:14px;color:#c9b6ac;max-width:560px;text-align:center;line-height:1.6}

.browser{width:760px;max-height:600px;background:#111;border:3px solid var(--paper);display:flex;flex-direction:column;color:#111}
.browser.dark{color:var(--paper)}
.bwtop{background:#ddd;display:flex;align-items:center;gap:8px;padding:9px 12px;flex:none}
.bwdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.bwdot.r{background:#ff5f57}.bwdot.y{background:#ffbd2e}.bwdot.g{background:#28c840}
.bwaddr{flex:1;background:#fff;border-radius:14px;padding:6px 14px;font-size:13px;color:#333;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bwbody{background:#fff;padding:24px;overflow:auto;max-height:520px}
.browser.dark .bwbody{background:#1a0203}
.bwsearchbox{display:flex;gap:8px;margin-bottom:16px}
.bwinput{flex:1;padding:10px 14px;border:1px solid #ccc;border-radius:20px;font-size:15px}
.bwsuggest{display:flex;gap:8px;flex-wrap:wrap}
.bwchip{background:#eee;border-radius:14px;padding:6px 14px;font-size:13px;cursor:pointer;color:#222}
.bwchip:hover{background:#ddd}
.bwitem{padding:14px 0;border-bottom:1px solid #eee}
.bwitem[data-go]{cursor:pointer}
.bwtitle{color:#1a0dab;font-size:17px;font-weight:600}
.bwurl{color:#006621;font-size:12px;margin:2px 0}
.bwdesc{color:#444;font-size:13px}
.bwempty{color:#777;padding:20px 0}
.archiveBody{display:flex;flex-direction:column;align-items:center;gap:18px;padding:44px 20px}
.n88s{font-family:var(--disp);font-size:70px;color:var(--red);line-height:1}
.quiz{font-size:18px;text-align:center}
.qopts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.qbtn{background:#000;color:var(--paper);border:2px solid var(--paper);padding:8px 22px;font-size:15px}
.qbtn:hover{background:var(--red);border-color:var(--red)}
.qmsg{color:var(--red);min-height:20px;font-size:14px}

#erase{position:absolute;inset:0;background:radial-gradient(circle,#3b0000 0%,#000 80%);opacity:0;transition:opacity 1.2s;z-index:29;mix-blend-mode:multiply;pointer-events:none}
#erase.on{opacity:.88}
#ground{position:absolute;inset:0;z-index:65;background:rgba(0,0,0,.4)}
.groundword{position:absolute;font-size:24px;font-weight:800;color:#fff;background:#000;border:3px solid var(--red);padding:6px 16px;cursor:pointer;z-index:66;user-select:none}
.groundword:hover{background:var(--red)}

.ch3desk{position:absolute;top:44px;left:0;right:0;height:592px;background:radial-gradient(ellipse at 30% 20%,#2a0606,#0a0203 70%);overflow:hidden}
.mentalBar{position:absolute;left:30px;right:30px;top:8px;height:22px;display:flex;align-items:center;gap:10px;font-size:13px;z-index:2}
.mentalTrack{flex:1;height:14px;background:#1a0507;border:2px solid var(--paper)}
.mentalFill{height:100%;background:#5fe37a;transition:width .3s}
.ch3win{position:absolute;background:#c0c0c0;border:2px outset #fff;box-shadow:6px 6px 0 rgba(0,0,0,.55);display:flex;flex-direction:column;color:#111}
.ch3win .titlebar{background:linear-gradient(90deg,#7a0000,#c40000);color:#fff;padding:5px 10px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;flex:none}
.boardWin{left:30px;top:38px;width:560px;height:530px}
.reportWin{left:610px;top:38px;width:640px;height:530px}
.boardList{flex:1;overflow-y:auto;background:#160305;color:var(--paper);min-height:0}
.post{padding:11px 14px;border-bottom:1px solid #2a1013;font-size:14px;transition:opacity .5s;line-height:1.5}
.post .pu{display:block;font-size:11px;color:#8a7268;margin-bottom:3px}
.post.normal{color:#cbbfae}
.post.creepy{color:#ffb3b3;background:rgba(120,0,0,.14)}
.post.crazy{color:#ff6a6a;background:rgba(160,0,0,.24);font-weight:800}
.post.key{cursor:pointer;color:#ffd34a;text-decoration:underline}
.boardList.dim .post.normal{opacity:.15}
.reportBody{flex:1;overflow-y:auto;background:#160305;color:var(--paper);padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.repRow{display:flex;flex-direction:column;gap:6px}
.repRow.locked{opacity:.6}
.repLock{font-size:12px;color:#e0b400;border:1px dashed #5a4a10;padding:6px 10px}
.repLabel{font-size:13px;color:#d9c9c0}
.repOpts{display:flex;gap:8px;flex-wrap:wrap}
.repOpt{background:#1a0507;color:var(--paper);border:2px solid var(--maroon-l);padding:5px 16px;font-size:14px}
.repOpt.ok{background:#1f5a2f;border-color:#5fe37a}
.repOpt.bad{background:#5a1f1f;border-color:var(--red)}
#btnSubmitReport{margin:10px 14px 12px;font-size:15px;padding:9px 0;flex:none}
#btnSubmitReport.disabled{opacity:.35;pointer-events:none}

.photoCompare{background:#160305;border:3px solid var(--paper);padding:24px;text-align:center}
.pcTitle{font-size:16px;color:#ffd34a;margin-bottom:14px}
.pcRow{display:flex;gap:16px;justify-content:center}
.pcCard{display:flex;flex-direction:column;align-items:center;gap:6px}
.pcLabel{font-size:12px;color:#c9b6ac}
.pcNote{margin-top:16px;font-size:16px;color:var(--red);font-weight:800}

#leaderOv{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;filter:drop-shadow(0 0 44px rgba(238,0,0,.75))}
.erosion{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:monospace;font-size:22px;color:#ff4747;z-index:41;background:#000;padding:6px 22px;border:2px solid var(--red)}
.choiceBtns{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);display:flex;gap:26px;z-index:41}
.big2{font-size:20px;padding:10px 30px}

<script>
'use strict';
const BRIDGE_VIDEO = "assets/title_start_video.mp4";
/* 교주 일러스트(컷아웃), 초상 크롭, 다시하기 화면 영상 */
const LEADER_FULL = "assets/leader_full.webp";
const LEADER_FACE = "assets/leader_face.jpg";
const RETRY_VIDEO = "assets/retry_video.mp4";

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = '#f6f2ea', K = '#0b0203', R = '#ee0000', DR = '#7a0000', M = '#3b0b0b';

const stage = $('#stage'), sceneEl = $('#scene'), hudTop = $('#hudTop'), hudBot = $('#hudBot');
const dlgEl = $('#dlg'), modalEl = $('#modal'), tipEl = $('#tip'), toastEl = $('#toast');

/* 통화 음성 슬롯: mp3를 data URL로 넣으면 실제 음성 + 실제 스펙트럼으로 재생됩니다 */
const CALL_AUDIO = { call1: "assets/audio/voice_call1.mp3", call2: "assets/audio/voice_call2.mp3", freq: "assets/audio/voice_freq.mp3" };   // 신고자1 / 신고자2 / 신도1(공중전화)
const BGM_DATA = { title: "assets/audio/bgm1_title.mp3", game: "assets/audio/bgm2_game.mp3", archive: "assets/audio/bgm7_archive.mp3", hack: "assets/audio/bgm8_hack.mp3", end: "assets/audio/bgm9_end.mp3" };
const BGM_VOL = { title: 0.8, game: 0.7, archive: 0.8, hack: 0.85, end: 0.8 };
const CREDIT_IMG = "assets/credit.webp";

/* ---------------- 저장소 / 설정 ---------------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SET_KEY = 'kim88.set.v1', SAVE_KEY = 'kim88.save.v1';
const SET = Object.assign({ bgm: 0.8, sfx: 0.8, voice: 1, text: 1, subs: true, reduce: false }, (() => { try { return JSON.parse(LS.get(SET_KEY) || '{}'); } catch (e) { return {}; } })());
const TYPE_MS = () => [42, 24, 8][SET.text] || 24;

const S = {
  view: null, stack: [], inv: [], sel: null, lk: 0, scale: 1, reduce: SET.reduce, started: false, loc: 'police',
  mission: '',
  f: {
    ch: 1,
    callDone: false, visitedRoom: false, bowlDig: 0, bowlFlip: false, keyTape: 0, keyTaken: false,
    drawerUnlocked: false, drawerPull: 0, drawerJam: true, drawerOpen: false,
    bandPull: 0, bandCut: false, notebookTaken: false, wardOpen: false, coat: 0, zipOpen: false, phoneTaken: false,
    frameNote: false, tape: [false, false, false, false], tapeMiss: 0, newsDropped: false, newsTaken: false,
    phoneUnlocked: false, kw: {}, kwWrong: 0, phoneClueDone: false, newsRead: false, ready: false,
    call2: false, busSeen: false, camId: false, trackIdx: 0, trackFail: 0, trackDone: false, boothOpen: false,
    boothTalked: false, freqStage: 1, freqVal: 0, freqLocked: false, filterVal: 0, freqDone: false,
    searchPrompted: false, browserStage: '', bwTyped: '', archiveTries: 0, loggedIn: false,
    mental: 100, boardSeen: {}, reportAns: {}, reportDone: false, leaderSeen: false, groundCooldownUntil: 0
  }
};

let fitW = 0, rotDismissed = false;
function fit() {
  /* 가상 키보드가 올라와 높이만 줄어든 경우에는 화면 배율을 유지 */

  if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.type !== 'checkbox' && ae.type !== 'range' && innerWidth === fitW) return;
  fitW = innerWidth;
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  S.scale = s;
  stage.style.transform = `scale(${s})`;
  $('#rot').style.display = (innerHeight > innerWidth && innerWidth < 1100 && !rotDismissed) ? 'block' : 'none';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

/* ---------------- Audio ---------------- */
const A = {
  ctx: null, master: null, muted: false, noiseBuf: null, amb: null, ringT: null,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = SET.sfx; this.sfxBus.connect(this.master);
      this.voiceBus = this.ctx.createGain(); this.voiceBus.gain.value = SET.voice; this.voiceBus.connect(this.master);
      const c = this.ctx, len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  mute(m) {
    this.muted = m;
    if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.03);
    if (m && window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  },
  tone(f, dur, type = 'sine', vol = 0.15, delay = 0, f2) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  },
  burst(dur, ftype, freq, q, vol, delay = 0, fEnd) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource();
    s.buffer = this.noiseBuf; s.loop = true;
    const flt = c.createBiquadFilter(); flt.type = ftype; flt.frequency.setValueAtTime(freq, t);
    if (fEnd) flt.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
    flt.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(this.sfxBus); s.start(t); s.stop(t + dur + 0.05);
  },
  sfx(n) {
    if (!this.ctx || this.muted) return;
    switch (n) {
      case 'click': this.burst(0.05, 'highpass', 2500, 0.7, 0.12); break;
      case 'ping': this.tone(880, 0.25, 'triangle', 0.16); this.tone(1320, 0.3, 'triangle', 0.12, 0.09); break;
      case 'ping2': this.tone(660, 0.15, 'triangle', 0.13); break;
      case 'err': this.tone(140, 0.25, 'sawtooth', 0.12, 0, 90); break;
      case 'unlock': this.burst(0.06, 'highpass', 3000, 1, 0.15); this.tone(520, 0.12, 'square', 0.08, 0.06); this.tone(780, 0.18, 'square', 0.08, 0.16); break;
      case 'drawer': this.burst(0.5, 'lowpass', 700, 0.8, 0.4, 0, 180); break;
      case 'paper': this.burst(0.28, 'highpass', 2500, 0.6, 0.16, 0, 5000); break;
      case 'rip': this.burst(0.35, 'bandpass', 1800, 1.2, 0.22, 0, 600); break;
      case 'zip': for (let i = 0; i < 8; i++) this.burst(0.04, 'highpass', 3500, 1, 0.1, i * 0.05); break;
      case 'snap': this.burst(0.05, 'highpass', 1500, 1, 0.25); this.tone(300, 0.08, 'square', 0.1, 0, 120); break;
      case 'creak': this.tone(190, 0.7, 'sawtooth', 0.05, 0, 140); this.burst(0.7, 'bandpass', 500, 4, 0.08, 0, 300); break;
      case 'whisper': for (let i = 0; i < 5; i++) this.burst(0.09, 'bandpass', 2600 + (i % 2) * 500, 7, 0.09, i * 0.14); this.tone(88, 1.0, 'sine', 0.08); break;
      case 'busy': for (let i = 0; i < 4; i++) this.tone(425, 0.22, 'sine', 0.12, i * 0.4); break;
      case 'flicker': this.burst(0.05, 'bandpass', 3000, 2, 0.18); this.burst(0.05, 'bandpass', 2200, 2, 0.14, 0.09); break;
    }
  },
  startAmb() {
    if (!this.ctx || this.amb) return;
    const c = this.ctx;
    const rs = c.createBufferSource(); rs.buffer = this.noiseBuf; rs.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.35;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    const rg = c.createGain(); rg.gain.value = 0; rg.gain.linearRampToValueAtTime(0.045, c.currentTime + 3);
    rs.connect(bp); bp.connect(lp); lp.connect(rg); rg.connect(this.sfxBus); rs.start();
    const ho = c.createOscillator(); ho.type = 'sawtooth'; ho.frequency.value = 100;
    const hl = c.createBiquadFilter(); hl.type = 'lowpass'; hl.frequency.value = 380;
    const hg = c.createGain(); hg.gain.value = 0; hg.gain.linearRampToValueAtTime(0.011, c.currentTime + 3);
    ho.connect(hl); hl.connect(hg); hg.connect(this.sfxBus); ho.start();
    const lo = c.createOscillator(); lo.type = 'sine'; lo.frequency.value = 88;
    const lg = c.createGain(); lg.gain.value = 0; lo.connect(lg); lg.connect(this.sfxBus); lo.start();
    this.amb = { rg, hg, lg };
  },
  setHum88(v, t = 1.5) { if (this.amb) this.amb.lg.gain.setTargetAtTime(v, this.ctx.currentTime, t); },
  setHum(v) { if (this.amb) this.amb.hg.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  flicker() { this.sfx('flicker'); this.setHum(0.004); setTimeout(() => this.setHum(0.011), 260); },
  ring(on) {
    clearInterval(this.ringT); this.ringT = null;
    if (!on || !this.ctx) return;
    const pat = () => { if (this.muted) return; for (let i = 0; i < 14; i++) this.tone(i % 2 ? 1400 : 1100, 0.05, 'square', 0.05, i * 0.06); };
    pat(); this.ringT = setInterval(pat, 2200);
  }
};

/* ---------------- BGM (WebAudio · 크로스페이드 루프) ---------------- */
/* data URL → ArrayBuffer (fetch를 쓰지 않는다: 게시 페이지의 CSP가 data: fetch를 막을 수 있음) */
/* 자산이 data URL(단일 파일 빌드)이든 일반 파일 주소(호스팅 빌드)이든 읽는다 */
async function getBuf(u) { if (/^data:/.test(u)) return dataUrlToBuf(u); const r = await fetch(u); if (!r.ok) throw new Error('fetch ' + r.status); return await r.arrayBuffer(); }
function dataUrlToBuf(u) { const b = atob(u.slice(u.indexOf(',') + 1)), n = b.length, a = new Uint8Array(n); for (let i = 0; i < n; i++) a[i] = b.charCodeAt(i); return a.buffer; }
const BGM = {
  bus: null, buf: {}, pend: {}, voices: [], cur: null, want: null, XF: 3, LEAD: 12,
  ok() { if (!A.ctx) return false; if (!this.bus) { this.bus = A.ctx.createGain(); this.bus.gain.value = SET.bgm; this.bus.connect(A.master); } return true; },
  load(name) {
    if (this.buf[name]) return Promise.resolve(this.buf[name]);
    if (!this.pend[name]) this.pend[name] = (async () => {
      try { const ab = await getBuf(BGM_DATA[name]); this.buf[name] = await new Promise((ok, ng) => A.ctx.decodeAudioData(ab, ok, ng)); }
      catch (e) { this.buf[name] = null; console.warn('BGM load failed', name, e); }
      return this.buf[name];
    })();
    return this.pend[name];
  },
  preload(list) { list.reduce((p, n) => p.then(() => this.load(n)), Promise.resolve()); },
  async play(name, fade = 1.5) {
    if (!this.ok()) return;
    this.want = name; if (this.cur === name) return;
    const b = await this.load(name);
    if (!b || this.want !== name || this.cur === name) return;
    this.stopAll(fade); this.cur = name;
    this._voice(name, b, A.ctx.currentTime + 0.05, fade);
  },
  _voice(name, b, startT, fadeIn) {
    const c = A.ctx, d = b.duration, xf = Math.min(this.XF, d / 3), vol = BGM_VOL[name] || 0.7;
    const src = c.createBufferSource(), g = c.createGain(); src.buffer = b;
    g.gain.setValueAtTime(0.0001, startT); g.gain.linearRampToValueAtTime(vol, startT + fadeIn);
    g.gain.setValueAtTime(vol, startT + d - xf); g.gain.linearRampToValueAtTime(0.0001, startT + d);
    src.connect(g); g.connect(this.bus); src.start(startT);
    const v = { src, g, dead: false }; this.voices.push(v);
    src.onended = () => { v.dead = true; this.voices = this.voices.filter(x => x !== v); };
    const nextT = startT + d - xf, delay = Math.max(0, (nextT - this.LEAD - c.currentTime) * 1000);
    setTimeout(() => { if (!v.dead && this.cur === name) this._voice(name, b, nextT, xf); }, delay);   // 끝나기 전에 다음 회차를 겹쳐 예약 → 자연스러운 루프
  },
  stopAll(fade = 1) {
    if (!A.ctx) return; const t = A.ctx.currentTime;
    this.voices.slice().forEach(v => { v.dead = true; try { v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t); v.g.gain.linearRampToValueAtTime(0.0001, t + fade); v.src.stop(t + fade + 0.1); } catch (e) {} });
    this.cur = null;
  },
  ducked: false,
  duck(on) { this.ducked = on; this.applyVol(); },
  applyVol() { if (this.ok()) this.bus.gain.setTargetAtTime(SET.bgm * (this.ducked ? 0.25 : 1), A.ctx.currentTime, 0.25); }
};

/* 통화 음성 디코딩 캐시 (길이를 알아야 자막 속도를 맞춤) */
const CALL_BUF = {};
function loadCall(id) {
  if (!CALL_BUF[id]) CALL_BUF[id] = (async () => {
    const data = CALL_AUDIO[id]; if (!data || !A.ctx) return null;
    try { const ab = await getBuf(data); return await new Promise((ok, ng) => A.ctx.decodeAudioData(ab, ok, ng)); } catch (e) { console.warn('call audio load failed', id, e); return null; }
  })();
  return CALL_BUF[id];
}
async function typeMs(id, text, dflt) { const b = await loadCall(id); return b ? Math.max(20, b.duration * 1000 / text.length) : dflt; }

/* ---------------- 통화 음성 / 스펙트럼 ---------------- */
const Spec = { an: null, arr: null, level: 0, tgt: 0, speaking: false, pulse: 0, raf: 0, skipReal: null };
let skipped = false;

function cwait(ms) {
  return new Promise(r => {
    const t0 = Date.now();
    const i = setInterval(() => { if (skipped || Date.now() - t0 >= ms) { clearInterval(i); r(); } }, 50);
  });
}

function ttsSpeak(text) {
  return new Promise(res => {
    const ss = window.speechSynthesis;
    if (!ss || A.muted || typeof SpeechSynthesisUtterance === 'undefined') { res(false); return; }
    try {
      ss.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.pitch = 0.55; u.rate = 0.92; u.volume = SET.voice;
      let done = false;
      const fin = v => { if (!done) { done = true; clearTimeout(to); res(v); } };
      u.onstart = () => { Spec.speaking = true; };
      u.onboundary = () => { Spec.pulse = 1; };
      u.onend = () => { Spec.speaking = false; fin(true); };
      u.onerror = () => { Spec.speaking = false; fin(false); };
      const to = setTimeout(() => { Spec.speaking = false; fin(false); }, text.length * 260 + 4000);
      ss.speak(u);
    } catch (e) { res(false); }
  });
}

/* 목소리 자막: 영화 자막 스타일(노랑 + 검정 외곽선, 고딕, 작게). 음성 길이에 맞춰 문장 단위로 표시 */
const VSub = {
  timers: [],
  split(text) {
    const parts = text.match(/[^.!?~…]+[.!?~…]*\s*/g) || [text], out = [];
    parts.forEach(p => { p = p.trim(); if (!p) return; if (out.length && p.length < 7) out[out.length - 1] += ' ' + p; else out.push(p); });
    return out;
  },
  start(text, totalMs, leadMs = 250) {
    this.stop(); if (!SET.subs) return;
    const segs = this.split(text), sum = segs.reduce((a, s) => a + s.length, 0), el = $('#vsub');
    let t = leadMs; const span = Math.max(500, totalMs - leadMs - 200);
    segs.forEach(sg => {
      const d = span * sg.length / sum, at = t;
      this.timers.push(setTimeout(() => { el.textContent = sg; el.classList.add('on'); }, at));
      t += d;
    });
    this.timers.push(setTimeout(() => this.stop(), totalMs + 300));
  },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; const el = $('#vsub'); if (el) { el.classList.remove('on'); el.textContent = ''; } }
};

async function playCall(id, text, minMs) {
  const buf = await loadCall(id);
  if (buf && A.ctx) {
    try {
      const src = A.ctx.createBufferSource(); src.buffer = buf;
      const an = A.ctx.createAnalyser(); an.fftSize = 256;
      Spec.an = an; Spec.arr = new Uint8Array(an.frequencyBinCount);
      src.connect(an); an.connect(A.voiceBus || A.master);
      BGM.duck(true); VSub.start(text, buf.duration * 1000);
      await new Promise(r => { Spec.skipReal = () => { try { src.stop(); } catch (e) {} r(); }; src.onended = r; src.start(); });
      Spec.an = null; Spec.skipReal = null; BGM.duck(false); VSub.stop();
      return;
    } catch (e) { Spec.an = null; BGM.duck(false); VSub.stop(); }
  }
  const t0 = Date.now();
  Spec.speaking = true; VSub.start(text, Math.max(minMs, text.length * 90));
  await ttsSpeak(text);
  Spec.speaking = true;
  await cwait(Math.max(0, minMs - (Date.now() - t0)));
  Spec.speaking = false; VSub.stop();
}

function typeInto(el, text, ms) {
  return new Promise(res => {
    let i = 0;
    const t = setInterval(() => {
      i++; el.textContent = text.slice(0, i);
      if (skipped) { el.textContent = text; clearInterval(t); res(); return; }
      if (i >= text.length) { clearInterval(t); res(); }
    }, ms);
  });
}

function startSpecLoop(cv) {
  cancelAnimationFrame(Spec.raf);
  const c = cv.getContext('2d'), CW = cv.width, CH = cv.height, n = 48;
  const frame = () => {
    if (!document.body.contains(cv)) return;
    c.fillStyle = K; c.fillRect(0, 0, CW, CH);
    Spec.tgt = Spec.speaking ? 0.5 + Math.random() * 0.45 : 0.03;
    if (Spec.pulse > 0) { Spec.tgt = 1; Spec.pulse -= 0.12; }
    Spec.level += (Spec.tgt - Spec.level) * 0.3;
    const t = performance.now() / 1000, bw = (CW - 40) / n;
    if (Spec.an) Spec.an.getByteFrequencyData(Spec.arr);
    c.fillStyle = '#3b0b0b'; c.fillRect(20, CH / 2 - 1, CW - 40, 2);
    for (let i = 0; i < n; i++) {
      let v;
      if (Spec.an) { v = Spec.arr[Math.floor(i * Spec.arr.length * 0.55 / n)] / 255; }
      else {
        const env = Math.sin(Math.PI * (i + 0.5) / n);
        const nz = (Math.sin(t * 9 + i * 1.7) + Math.sin(t * 5.3 + i * 0.6) + 2) / 4;
        v = Spec.level * (0.25 + 0.75 * nz) * (0.3 + 0.7 * env);
      }
      const h = Math.max(3, v * (CH - 24));
      const x = 20 + i * bw + 2, y = CH / 2 - h / 2;
      c.fillStyle = R; c.fillRect(x, y, bw - 4, h);
      c.fillStyle = W; c.fillRect(x, y, bw - 4, 3); c.fillRect(x, y + h - 3, bw - 4, 3);
    }
    Spec.raf = requestAnimationFrame(frame);
  };
  frame();
}

function say(lines, opts = {}) {
  return new Promise(res => {

      lines: lines.map(l => Array.isArray(l) ? { who: (l[0] in WHO) ? WHO[l[0]] : l[0], text: l[1] } : { who: '공유 순경', text: l }),

function nextLine() {

let dragClean = [];
function enableDrag(el, { axis = 'y', need = 100, move, done }) {
  let on = false, sx = 0, sy = 0, fired = false;
  const pd = e => { on = true; fired = false; sx = e.clientX; sy = e.clientY; e.preventDefault(); };
  const pm = e => {
    if (!on) return;
    const d = axis === 'y' ? (e.clientY - sy) / S.scale : (e.clientX - sx) / S.scale;
    const v = Math.max(0, d);
    if (move) move(Math.min(v, need * 1.15));
    if (v >= need && !fired) { fired = true; on = false; if (done) done(); }
  };
  const pu = () => { if (on) { on = false; if (move) move(0); } };
  el.addEventListener('pointerdown', pd);
  el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  window.addEventListener('pointermove', pm);
  window.addEventListener('pointerup', pu);
  window.addEventListener('pointercancel', pu);
  dragClean.push(() => {
    window.removeEventListener('pointermove', pm);
    window.removeEventListener('pointerup', pu);
    window.removeEventListener('pointercancel', pu);
  });
}

/* ---- 씬 2-3: 88Hz 주파수 복원 미니게임 ---- */
const Static = {
  src: null, gain: null,
  start() {
    if (!A.ctx || this.src) return;
    const c = A.ctx;
    const s = c.createBufferSource(); s.buffer = A.noiseBuf; s.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 1200;
    const g = c.createGain(); g.gain.value = 0.3;

    this.src = s; this.gain = g;
  },
  update(dist) { if (this.gain) this.gain.gain.setTargetAtTime(0.04 + 0.34 * Math.min(1, Math.max(0, dist)), A.ctx.currentTime, 0.06); },
  stop() { if (this.src) { try { this.src.stop(); } catch (e) {} this.src = null; this.gain = null; } }
};
let tunerRaf = 0, tunerHold = 0, tunerLastT = 0;
VIEWS.tuner = {
  hud: true, field: true,
  render() {
    const f = S.f;
    sceneEl.innerHTML = `<div class="tuner">
      <h3>📻 주파수 복원 — 88Hz 대역을 찾아라</h3>
      <canvas id="scope" class="scope" width="520" height="110"></canvas>
      ${f.freqStage < 2 ? `
      <div class="knobWrap">
        <div class="knob" id="knob"><i id="needle"></i></div>
        <div class="freqBox">현재 <b id="freqNum">${f.freqVal}</b> Hz</div>
      </div>
      <div class="lockmeter"><div class="lockfill" id="lockfill" style="width:0%"></div></div>
      <div class="hintline">노브를 돌려 88Hz 부근을 찾은 뒤, <b>움직이지 말고 가만히</b> 있으면 고정된다.</div>
      ` : `
      <div class="filterRow">
        <div class="ftrack" id="ftrack"><div class="ffill" id="ffill" style="height:${f.filterVal}%"></div><div class="fhandle" id="fhandle" style="bottom:${f.filterVal}%"></div></div>
        <div class="hintline">88Hz는 고정됐다. 이제 필터를 끝까지 밀어올려 그 위의 잡음을 걷어내자.</div>
      </div>`}
    </div>`;
  },
  after() { initTuner(); }
};
function initTuner() {
  const f = S.f;
  cancelAnimationFrame(tunerRaf);
  tunerHold = 0; tunerLastT = performance.now();
  const cv = $('#scope');
  const draw = () => {
    if (!cv || !document.body.contains(cv)) return;
    const now = performance.now(); const dt = now - tunerLastT; tunerLastT = now;
    if (f.freqStage < 2 && !f.freqLocked) {
      const d0 = Math.abs(f.freqVal - 88);
      if (d0 <= 3) {
        tunerHold += dt;
        const lf = $('#lockfill'); if (lf) lf.style.width = Math.min(100, tunerHold / 900 * 100) + '%';
        if (tunerHold >= 900) { f.freqLocked = true; lockFreq(); return; }
      } else {
        tunerHold = 0;
        const lf = $('#lockfill'); if (lf) lf.style.width = '0%';
      }
    }
    const c = cv.getContext('2d'); c.fillStyle = K; c.fillRect(0, 0, 520, 110);
    const dist = f.freqStage < 2 ? Math.min(1, Math.abs(f.freqVal - 88) / 90) : Math.max(0, 1 - (f.filterVal || 0) / 100);
    const t = performance.now();
    for (let i = 0; i < 58; i++) {
      const nz = (Math.sin(t / 90 + i * 1.8) + Math.sin(t / 47 + i * 0.7) + 2) / 4;
      const h = Math.max(2, 6 + dist * 74 * nz);
      c.fillStyle = dist < 0.14 ? '#5fe37a' : R;
      c.fillRect(9 + i * 8.7, 55 - h / 2, 5, h);
    }
    tunerRaf = requestAnimationFrame(draw);
  };
  draw();
  Static.start();
  if (f.freqStage < 2) {
    const knob = $('#knob'), needle = $('#needle'), num = $('#freqNum');
    let angle = (f.freqVal / 200) * 260 - 130;
    needle.style.transform = `rotate(${angle}deg)`;
    Static.update(Math.min(1, Math.abs(f.freqVal - 88) / 90));
    let dragging = false;
    const setFromEvent = e => {
      const r = knob.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let deg = Math.atan2(e.clientX - cx, -(e.clientY - cy)) * 180 / Math.PI;
      deg = Math.max(-130, Math.min(130, deg));
      const val = Math.round((deg + 130) / 260 * 200);
      if (val !== f.freqVal) { f.freqVal = val; tunerHold = 0; }
      needle.style.transform = `rotate(${deg}deg)`; num.textContent = val;
      Static.update(Math.min(1, Math.abs(val - 88) / 90));
    };
    const pd = e => { dragging = true; setFromEvent(e); e.preventDefault(); };
    const pm = e => { if (dragging) setFromEvent(e); };
    const pu = () => { dragging = false; };
    knob.addEventListener('pointerdown', pd);
    knob.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    window.addEventListener('pointermove', pm);
    window.addEventListener('pointerup', pu);
    dragClean.push(() => { window.removeEventListener('pointermove', pm); window.removeEventListener('pointerup', pu); cancelAnimationFrame(tunerRaf); Static.stop(); });
  } else {
    const track = $('#ftrack'), fill = $('#ffill'), handle = $('#fhandle');
    Static.update(1 - f.filterVal / 100);
    let dragging = false;
    const setFromEvent = e => {
      const r = track.getBoundingClientRect();
      let v = 1 - ((e.clientY - r.top) / r.height);
      v = Math.max(0, Math.min(1, v));
      f.filterVal = Math.round(v * 100);
      fill.style.height = f.filterVal + '%'; handle.style.bottom = f.filterVal + '%';
      Static.update(1 - f.filterVal / 100);
      if (f.filterVal >= 92 && !f.freqDone) completeTuner();
    };
    const pd = e => { dragging = true; setFromEvent(e); e.preventDefault(); };
    const pm = e => { if (dragging) setFromEvent(e); };
    const pu = () => { dragging = false; };
    track.addEventListener('pointerdown', pd);
    track.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    window.addEventListener('pointermove', pm);
    window.addEventListener('pointerup', pu);
    dragClean.push(() => { window.removeEventListener('pointermove', pm); window.removeEventListener('pointerup', pu); cancelAnimationFrame(tunerRaf); Static.stop(); });
  }
}

      const max = list.scrollHeight - list.clientHeight;

      if (S.lk > 0 || modalOpen) return;
      let unlocked = false;
      POSTS.forEach(p => {
        if (p.mood === 'normal' || S.f.boardSeen[p.id]) return;
        const el = list.querySelector('[data-post="' + p.id + '"]');
        if (!el) return;
        const r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
        if (r.top < lr.bottom - 30) {
          S.f.boardSeen[p.id] = true; changeMental(p.mood === 'crazy' ? -14 : -8); A.sfx('whisper');
          if (REPORT.some(row => row.need === p.id)) unlocked = true;
        }
      });
      if (unlocked) { renderReportBody(); toast('보고서 빈칸이 하나 열렸다.', 1600); }
    };
    list.addEventListener('scroll', onScroll);
    const onClick = e => {
      if (S.lk > 0 || modalOpen) return;
      if (e.target.closest('.post.key')) { openLeaderPhotos(); return; }
      const opt = e.target.closest('.repOpt'); if (opt) { pickReport(opt.dataset.r, opt.dataset.v); return; }
      const sub = e.target.closest('#btnSubmitReport'); if (sub && !sub.disabled) submitReport();
    };
    sceneEl.addEventListener('click', onClick);
    dragClean.push(() => { list.removeEventListener('scroll', onScroll); sceneEl.removeEventListener('click', onClick); });
  }
};

  $('#erase').classList.remove('on'); corruptDesktop(false); A.setHum88(0.02, 1);
  await talk([['n', '전송 완료. 침식되던 공간이 원래대로 돌아오며 교주의 형상이 글리치와 함께 지워진다.'],
  ['n', '공유 순경이 작성한 38년 치 미제 사건 보고서를 바탕으로 본청 특수사건 전담반이 출동, 88교 본거지를 소탕했다.'],
  ['n', '공유는 미제 사건 해결의 공로를 인정받아 표창장을 받았다.']]);
  await sleep(400);
  await talk([['n', '— 며칠 뒤, 평화로워진 파출소. 공유가 컵라면을 젓가락으로 비비며 모니터를 바라본다.']]);
  const gh = document.createElement('div'); gh.className = 'trashGhost'; gh.textContent = 'ㅎㅎ88'; ($('.desk') || sceneEl).appendChild(gh); A.sfx('whisper');
  await talk([['g', '(멍하니 휴지통 아이콘을 바라보며) ...그런데, 교주의 말이 아주 틀린 것만은 아닌 것 같기도 하고.'],
  ['g', '(라면을 삼키며) 정말이지... 언젠가는 꼭 퇴사하고 말겠어.']]);
  showEnding('GOOD END', '정석 엔딩 · 훗날 퇴사 복선',
    ['공유는 미제 사건 해결의 공로를 인정받아 표창장을 받았다.', '뭐든 간에, 할 일은 한다.', '"정말이지... 언젠가는 꼭 퇴사하고 말겠어."']);
}
async function badEnding(ov) {
  BGM.play('end', 2.5);
  await talk([['g', '...듣고 보니, 그 말이 맞아.'], ['g', '이렇게 살려고 노력해 온 게 아니었는데...'], ['g', '매일 출근하고 야근하는 것도... 전부 부질없다.']]);
  A.sfx('busy'); await sleep(500);
  const off = document.createElement('div'); off.id = 'powerOff'; off.innerHTML = '<i></i>'; stage.appendChild(off);
  A.tone(70, 0.5, 'sine', 0.2, 0.45, 30); quietAmbient();
  await sleep(1300);
  clearInterval(leaderTimer); if (ov) ov.remove(); hackEl().innerHTML = '';
  await sleep(1100);
  showEnding('BAD END', 'erasure',
    ['툭 — 소리와 함께 전원이 꺼졌다.', '파출소 의자에는 공유의 경찰 조끼만 덩그러니 걸려 있다.',
      '꺼진 모니터에는 붉은 「88」 낙서만 남아 있고,', '공유라는 존재는 세상에서 완전히 지워져 사라졌다.'], true);
  off.remove();
}

function showEnding(tag, sub, lines, instant) {
  quietAmbient();
  const e = $('#end'); e.className = 'ending';
  e.style.transition = 'none'; e.style.opacity = instant ? 1 : 0;
  if (!instant) requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transition = 'opacity .9s'; e.style.opacity = 1; }));
  const d0 = 1.6, step = 1.5, endAt = d0 + lines.length * step;
  e.innerHTML = `<div class="endWrap"><div class="endTag">${esc(tag)}</div><div class="endSub">${esc(sub)}</div>
    <div class="endLines">${lines.map((l, i) => `<p style="animation-delay:${d0 + i * step}s">${esc(l)}</p>`).join('')}</div>
    <div class="endCredit" style="animation-delay:${endAt}s">8번다리에는 무엇도 없었다 · 1부 완결<br>플레이해주셔서 감사합니다.</div>
    <div class="endHint hidden" id="endHint">화면을 클릭하면 계속됩니다</div></div>`;
  let ready = false;
  const arm = () => { ready = true; const h = $('#endHint'); if (h) h.classList.remove('hidden'); };
  const timer = setTimeout(arm, (endAt + 1.4) * 1000);
  e.onclick = () => {
    if (!ready) {
      clearTimeout(timer);
      e.querySelectorAll('.endLines p,.endCredit').forEach(n => { n.style.animation = 'none'; n.style.opacity = 1; });
      setTimeout(arm, 400); return;
    }
    e.onclick = null; showCredits();
  };
}
function ensureEndBack() {
  if ($('#endBack')) return;
  const b = document.createElement('div'); b.id = 'endBack'; stage.appendChild(b);
}
async function showCredits() {
  ensureEndBack();
  const e = $('#end'); e.onclick = null; e.style.transition = 'opacity .7s'; e.style.opacity = 0; await sleep(750);
  e.className = 'credits'; e.style.transition = 'none';
  e.innerHTML = `<img class="creditImg" src="${CREDIT_IMG}" alt="Credit"><div class="creditHint hidden" id="creditHint">클릭하면 넘어갑니다</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transition = 'opacity 1.4s'; e.style.opacity = 1; }));
  let done = false;
  const next = () => { if (done) return; done = true; e.onclick = null; showRetry(); };
  const auto = setTimeout(next, 11000);
  setTimeout(() => { const h = $('#creditHint'); if (h) h.classList.remove('hidden'); e.style.cursor = 'pointer'; e.onclick = () => { clearTimeout(auto); next(); }; }, 2500);
}
async function showRetry() {
  ensureEndBack();
  const e = $('#end'); e.onclick = null; e.style.transition = 'opacity .5s'; e.style.opacity = 0; await sleep(550);
  e.className = 'retry';
  e.innerHTML = `<video class="retryVideo" id="retryVideo" autoplay muted loop playsinline></video><div class="retryHit" id="retryHit" title="다시하기"></div>`;
  const v = $('#retryVideo');
  v.onerror = () => { if (!$('#btnAgain')) { const b = document.createElement('button'); b.id = 'btnAgain'; b.className = 'bigbtn retryFallback'; b.textContent = '🔁 다시하기'; e.appendChild(b); } };
  v.src = RETRY_VIDEO; v.play().catch(() => {});
  e.style.transition = 'opacity .6s'; e.style.opacity = 1;
  setTimeout(() => { e.style.cursor = 'pointer'; e.onclick = () => location.reload(); }, 900);
}

/* ---------------- 설정 메뉴 ---------------- */
function saveSet() { LS.set(SET_KEY, JSON.stringify(SET)); }
function applySet() {
  if (A.ctx) { const t = A.ctx.currentTime; if (A.sfxBus) A.sfxBus.gain.setTargetAtTime(SET.sfx, t, 0.05); if (A.voiceBus) A.voiceBus.gain.setTargetAtTime(SET.voice, t, 0.05); }
  BGM.applyVol(); S.reduce = SET.reduce; document.body.classList.toggle('reduce', S.reduce);
  if (!SET.subs) VSub.stop();
}
function openSettings() {
  if (modalOpen) return;
  const pct = v => Math.round(v * 100) + '%';
  const rng = (key, label) => `<div class="setRow"><span>${label}</span><input type="range" min="0" max="100" value="${Math.round(SET[key] * 100)}" data-rng="${key}"><b>${pct(SET[key])}</b></div>`;
  const seg = (key, label, opts) => `<div class="setRow"><span>${label}</span><div class="seg" data-seg="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(SET[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
  openModal(`<div class="setPanel"><button class="xbtn" data-close>✕</button><div class="setTitle">설정</div>
    ${rng('bgm', '배경음악')}${rng('sfx', '효과음')}${rng('voice', '음성')}
    ${seg('text', '텍스트 속도', [[0, '느리게'], [1, '보통'], [2, '빠르게']])}
    ${seg('subs', '목소리 자막', [[true, '켜짐'], [false, '꺼짐']])}
    ${seg('reduce', '깜빡임·글리치 줄이기', [[false, '끄기'], [true, '켜기']])}
    ${(document.fullscreenEnabled || document.webkitFullscreenEnabled) ? '<div class="setRow"><span>전체 화면</span><div class="seg"><button id="btnFs" class="on" style="flex:1">전체 화면 켜기 / 끄기</button></div></div>' : ''}
    <div class="setFoot"><button class="setBtn" id="btnDelSave">저장 데이터 삭제</button><button class="setBtn" data-close>닫기</button></div>
    <div class="setNote">진행 상황은 자동으로 저장됩니다.</div></div>`);
  const panel = $('.setPanel', modalEl);
  panel.addEventListener('input', e => {
    const r = e.target.closest('[data-rng]'); if (!r) return;
    SET[r.dataset.rng] = r.value / 100; r.nextElementSibling.textContent = pct(SET[r.dataset.rng]); applySet(); saveSet();
  });
  panel.addEventListener('click', e => {
    const b = e.target.closest('.seg button');
    if (b) {
      const key = b.parentNode.dataset.seg, v = b.dataset.v;
      SET[key] = key === 'text' ? Number(v) : (v === 'true');
      b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      A.sfx('click'); applySet(); saveSet(); return;
    }
    if (e.target.id === 'btnFs') {
      try {
        const d = document, el = d.documentElement;
        if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } catch (err) { toast('이 환경에서는 전체 화면을 지원하지 않습니다', 2200); }
      return;
    }
    if (e.target.id === 'btnDelSave') { LS.del(SAVE_KEY); toast('저장 데이터를 삭제했습니다', 2000); }
  });
}

/* ---------------- 자동 저장 / 이어하기 ---------------- */
let lastSaveHash = '';
function saveOK() {
  const f = S.f;
  return S.started && f.callDone && (f.ch < 2 || f.call2) && f.ch < 4 && S.lk === 0 && !dlgQ && !modalOpen && !!VIEWS[S.view];
}
function autoSave() {
  if (!saveOK()) return;
  const data = { v: 1, t: Date.now(), f: S.f, inv: S.inv, mission: S.mission, loc: S.loc, view: S.view === 'tuner' ? 'booth' : S.view, stack: S.stack.filter(x => x !== 'tuner') };
  const h = JSON.stringify(Object.assign({}, data, { t: 0 }));
  if (h === lastSaveHash) return;
  if (LS.set(SAVE_KEY, JSON.stringify(data))) {
    lastSaveHash = h;
    const el = $('#saveInd'); if (el) { el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
  }
}
function readSave() { try { const d = JSON.parse(LS.get(SAVE_KEY)); return d && d.v === 1 && d.f ? d : null; } catch (e) { return null; } }
function continueGame(d) {
  S.started = true; Object.assign(S.f, d.f); S.inv = d.inv || []; S.mission = d.mission || ''; S.loc = d.loc || 'police'; S.sel = null;
  S.stack = (d.stack || []).filter(v => VIEWS[v]); S.view = VIEWS[d.view] ? d.view : 'station';
  A.startAmb(); BGM.play(S.f.loggedIn ? 'archive' : 'game', 2);
  $('#title').classList.add('hidden'); const g = $('#gate'); if (g) g.remove();
  try { render(); } catch (e) { S.view = 'station'; S.stack = []; render(); }
  lastSaveHash = JSON.stringify(Object.assign({}, d, { t: 0 }));
  toast('저장된 지점에서 이어합니다', 2400);
}
setInterval(autoSave, 3000);
addEventListener('pagehide', autoSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoSave(); });

/* ---------------- 부팅 ---------------- */
function wireBridgeVideos() {
  document.querySelectorAll('.bridgeVideo').forEach(v => {
    if (!v.src && typeof BRIDGE_VIDEO !== 'undefined') { v.src = BRIDGE_VIDEO; v.play().catch(() => {}); }
  });
}
wireBridgeVideos();
$('#btnGate').onclick = () => {
  const rc = $('#optReduce'); SET.reduce = !!(rc && rc.checked); saveSet(); applySet();
  A.init(); A.resume(); BGM.play('title', 2); BGM.preload(['game', 'archive', 'hack', 'end']);
  ['call1', 'call2', 'freq'].forEach(loadCall);
  const g = $('#gate'); g.style.pointerEvents = 'none'; g.style.transition = 'opacity .9s'; g.style.opacity = 0; setTimeout(() => g.remove(), 1000);
};
$('#title').addEventListener('click', startGame);
{
  const rc = $('#optReduce'); if (rc) rc.checked = SET.reduce; document.body.classList.toggle('reduce', S.reduce);
  const sv = readSave();
  if (sv) {
    const d = new Date(sv.t), chn = ['', '1장 기', '2장 승', '3장 전'][sv.f.ch] || '';
    const when = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const b = document.createElement('button'); b.id = 'btnContinue'; b.className = 'choicePlate';
    b.innerHTML = `<span>이어하기<small>${chn} · ${when} 저장</small></span>`;
    $('#btnGate').parentNode.insertBefore(b, $('#btnGate')); $('#btnGate').textContent = '새로 시작';
    b.onclick = () => {
      SET.reduce = !!($('#optReduce') && $('#optReduce').checked); saveSet(); applySet();
      A.init(); A.resume(); BGM.preload(['game', 'archive', 'hack', 'end']); ['call1', 'call2', 'freq'].forEach(loadCall);
      continueGame(sv);
    };
  }
}
$('#bSet').onclick = openSettings;
$('#rotX').onclick = () => { rotDismissed = true; $('#rot').style.display = 'none'; };
addEventListener('pointerdown', () => { if (A.ctx && A.ctx.state !== 'running') A.ctx.resume(); }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && A.ctx && A.ctx.state !== 'running') A.ctx.resume(); });
$('#bBack').onclick = back;
$('#bMap').onclick = () => { if (S.lk > 0 || dlgQ || modalOpen) return; A.sfx('click'); go('map'); };
$('#bHint').onclick = hint;
const toggleSnd = () => { A.mute(!A.muted); $('#bSnd').textContent = A.muted ? '🔇' : '🔊'; const t = $('#tsnd'); if (t) t.textContent = A.muted ? '🔇' : '🔊'; };
$('#bSnd').onclick = toggleSnd;
sceneEl.addEventListener('click', e => { if (e.target.id === 'tsnd') toggleSnd(); if (e.target.id === 'tset') openSettings(); });
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { if (dlgQ) { e.preventDefault(); dlgAdvance(); } }
  else if (e.key === 'Escape') { if (!dlgQ) back(); }
});
fit();
</script>
