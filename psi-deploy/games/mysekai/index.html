<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3dcc0">
<title>마이세카이</title>
<style>
:root{--cream:rgba(255,250,240,.9);--ink:#4a3d32;--sub:#8a7462;--accent:#ff9a6a;--accent2:#f6c27a;--shadow:0 4px 16px rgba(80,50,20,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3dcc0;font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui .p{pointer-events:auto}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 80% at 50% 55%,transparent 65%,rgba(70,40,20,.14));transition:background 1s}
.top{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;max-width:calc(100% - 170px)}
.place{display:flex;align-items:center;gap:10px;background:var(--cream);padding:6px 16px 6px 6px;border-radius:22px;box-shadow:var(--shadow)}
.place .ic{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#f6c27a,#e8956a);display:grid;place-items:center;font-size:20px}
.place b{display:block;font-size:15px}.place small{font-size:12px;color:var(--sub)}
.pill{background:var(--cream);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);margin-top:4px}
.pill i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a8,#f0b840);display:grid;place-items:center;font-style:normal;font-size:12px}
.mini{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:118px;height:118px;border-radius:50%;background:var(--cream);padding:6px;box-shadow:var(--shadow);cursor:pointer}
.mini canvas{width:100%;height:100%;border-radius:50%;display:block}
.mini span{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:rgba(60,40,30,.8);color:#fff8ec;font-size:11px;font-weight:800;border-radius:9px;padding:2px 8px;white-space:nowrap}
.menu{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(146px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.mb{width:46px;height:46px;border-radius:50%;background:var(--cream);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;border:0;cursor:pointer;position:relative}
.mb .dot{position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#ff6a5a;border:2px solid #fff}
.quest{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(118px + env(safe-area-inset-top));width:220px;background:rgba(255,250,240,.82);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px}
.quest h4{margin:0 0 4px;font-size:11.5px;color:#d0784a;letter-spacing:.5px}.quest p{margin:4px 0;display:flex;gap:6px;align-items:flex-start;line-height:1.35}.quest p b{flex:none;font-size:10px;color:#fff;border-radius:6px;padding:1px 6px;margin-top:1px}
.quest .bar{height:4px;border-radius:3px;background:#eaddcc;margin-top:3px}.quest .bar i{display:block;height:100%;border-radius:3px;background:#f6a07a}
.quest p.done span{color:#9a8a78;text-decoration:line-through}
.joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,250,240,.2);border:2px solid rgba(255,250,240,.75);display:none}
.joy span{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,250,240,.92);box-shadow:var(--shadow)}
.joyhint{position:absolute;left:calc(40px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,250,240,.7);display:grid;place-items:center;color:#fff8ec;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.acts{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:200px;height:190px}
.act{position:absolute;width:62px;height:62px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:var(--shadow);border:0;color:var(--ink);cursor:pointer;line-height:1.1;text-align:center}
.act .e{font-size:22px;display:block}
.act.big{right:0;bottom:0;width:92px;height:92px;background:linear-gradient(135deg,#f6c27a,#e8956a);color:#fff;font-size:13px}
.act.big .e{font-size:30px}.act.big.off{background:rgba(255,250,240,.7);color:var(--sub)}
.act.jump{right:104px;bottom:2px}.act.run{right:88px;bottom:86px}
.act.run.on{background:#ffd8b8}
.prompt{position:absolute;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,250,240,.96);border-radius:999px;padding:7px 18px 7px 7px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(80,50,20,.25);white-space:nowrap;cursor:pointer}
.prompt kbd{min-width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 14px sans-serif}
.prompt small{color:var(--sub);font-weight:700}
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:center;width:min(90vw,420px)}
.toast{background:rgba(60,40,30,.84);color:#fff8ec;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.say{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,560px);background:rgba(255,250,240,.97);border-radius:22px;padding:14px 18px 14px;box-shadow:0 10px 30px rgba(80,50,20,.28);font-size:15px;line-height:1.55;cursor:pointer}
.say b{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:2px 10px;font-size:12px;margin-bottom:6px}
.say .nx{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--sub);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.sheetbg{position:absolute;inset:0;background:rgba(40,26,16,.35);display:grid;place-items:center;padding:16px}
.sheet{width:min(94vw,520px);max-height:min(84vh,680px);background:#fffaf0;border-radius:24px;box-shadow:0 16px 40px rgba(60,30,10,.3);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #f0e4d2}
.sheet header .ic{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#f6c27a,#e8956a);display:grid;place-items:center;font-size:22px}
.sheet header h3{margin:0;font-size:17px;flex:1}.sheet header small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.sheet header button{border:0;background:#f3e8d8;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
.sheet .body{padding:12px 16px 16px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet .body p{margin:6px 0;line-height:1.55;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#f8efe2;margin:6px 0}
.row .ri{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.row .rt{flex:1;min-width:0}.row .rt b{display:block;font-size:14px}.row .rt small{font-size:12px;color:var(--sub)}
.btn{border:0;border-radius:12px;padding:8px 14px;font:800 13px inherit;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn.sub{background:#eadccb;color:var(--ink)}.btn:disabled{background:#e6ddd2;color:#b0a090;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{background:#f8efe2;border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;position:relative}
.cell .ce{font-size:28px;display:block;margin-bottom:4px}.cell.lock{color:#c0b0a0}.cell.lock .ce{filter:grayscale(1) brightness(.2);opacity:.35}
.cell em{position:absolute;right:6px;top:4px;font-style:normal;font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:2px 0 10px;flex-wrap:wrap}.tabs button{border:0;border-radius:999px;padding:6px 12px;background:#f0e4d2;font:700 13px inherit;color:var(--ink);cursor:pointer;font-family:inherit}.tabs button.on{background:var(--accent);color:#fff}
.fmap{position:absolute;inset:0;background:rgba(40,26,16,.5);display:grid;place-items:center}
.fmap .wrap{position:relative;width:min(94vw,86vh);aspect-ratio:1;border-radius:26px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35);background:#c8cf94}
.fmap img{width:100%;height:100%;display:block}
.fmap .mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.fmap .mk .i{width:30px;height:30px;border-radius:50%;background:rgba(255,250,240,.96);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 8px rgba(60,40,20,.3);border:2px solid var(--accent2)}
.fmap .mk .n{background:rgba(60,40,30,.8);color:#fff8ec;border-radius:8px;padding:1px 6px;font-size:10.5px;font-weight:800;white-space:nowrap}
.fmap .mk.npc .i{border-color:#a8d0f0}.fmap .mk.wp .i{border-color:#ff6a5a;background:#ffe8e0}
.fmap .me{position:absolute;width:0;height:0;transform:translate(-50%,-50%)}
.fmap .me i{position:absolute;left:-11px;top:-13px;width:22px;height:26px;background:#ff6a5a;clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.fmap .cl{position:absolute;right:12px;top:12px;border:0;background:var(--cream);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.fmap .tt{position:absolute;left:12px;top:12px;background:var(--cream);border-radius:14px;padding:6px 12px;font-weight:800;font-size:13px}
.fmap .info{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--cream);border-radius:16px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.fish{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.fish .card{pointer-events:auto;background:rgba(255,250,240,.94);border-radius:20px;padding:8px 14px 8px 10px;box-shadow:0 8px 24px rgba(60,30,10,.25);display:flex;align-items:center;gap:10px;text-align:left;max-width:92vw}
.fish .big{font-size:30px;margin:0}.fish .t{font-weight:800;font-size:15px}.fish small{color:var(--sub);font-size:12px;display:block}
.fish .card p{margin:0!important}.fish .mid{min-width:150px}
.fish .meter{height:9px;border-radius:6px;background:#eadccb;margin:5px 0 0;overflow:hidden}.fish .meter i{display:block;height:100%;background:linear-gradient(90deg,#9ccf6a,#f6c27a,#ff7a5a);width:0}
.fade{position:absolute;inset:0;background:#120c08;opacity:0;transition:opacity .6s;pointer-events:none}
.fade.on{opacity:1}
.fade.dark{background:#05060c}
.load{position:fixed;inset:0;background:linear-gradient(#f6d2a8,#ffc59a);display:grid;place-items:center;z-index:10;transition:opacity .6s}
.load .c{text-align:center}.load h1{margin:0 0 6px;font-size:34px;letter-spacing:-1px;color:#6a4632}.load p{margin:0;color:#8a6a52;font-weight:700}
.load .bar{width:220px;height:8px;border-radius:5px;background:rgba(255,255,255,.5);margin:18px auto 10px;overflow:hidden}.load .bar i{display:block;height:100%;width:5%;background:#e8956a;transition:width .3s}
.load button{margin-top:16px;border:0;border-radius:999px;padding:12px 30px;font:800 16px inherit;background:#fffaf0;color:#c86a4a;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;display:none}
.load small{display:block;margin-top:14px;color:#9a7a62;font-size:12px;line-height:1.6}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));z-index:11;font-size:12px;color:#8a6a52;text-decoration:none;font-weight:700}
.poses{position:absolute;right:calc(70px + env(safe-area-inset-right));top:calc(146px + env(safe-area-inset-top));display:grid;grid-template-columns:repeat(4,64px);gap:6px;background:rgba(255,250,240,.94);padding:8px;border-radius:18px;box-shadow:var(--shadow)}
.poses[hidden]{display:none}.poses button{border:0;background:#f8efe2;border-radius:12px;padding:6px 2px;font:700 11.5px inherit;color:var(--ink);cursor:pointer;font-family:inherit}.poses button span{display:block;font-size:22px}
@media (pointer:coarse){.poses{top:calc(128px + env(safe-area-inset-top));right:calc(64px + env(safe-area-inset-right))}}
.heart{position:absolute;font-size:22px;animation:up 1.2s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-70px) scale(1.3);opacity:0}}
@media (max-width:640px){.quest{display:none}.quest.show{display:block;top:calc(64px + env(safe-area-inset-top))}.place small{display:none}.mini{width:96px;height:96px}.menu{top:calc(124px + env(safe-area-inset-top))}.mb{width:42px;height:42px;font-size:18px}.top{max-width:calc(100% - 130px)}}
@media (pointer:fine){.joyhint,.act.jump,.act.run{display:none}}
@media (pointer:coarse){.quest{display:none}.mini{width:100px;height:100px}.menu{top:calc(128px + env(safe-area-inset-top))}}
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div class="load" id="load"><div class="c"><h1>마이세카이</h1><p>정보구출반의 작은 세계</p><div class="bar"><i id="lbar"></i></div><p id="lmsg" style="font-size:13px">세계를 짓는 중…</p><button id="lgo">들어가기</button>
<small>PC: WASD/방향키 이동 · Shift 달리기 · Space 점프 · F 상호작용 · M 지도 · Q 카메라 뒤로 · G 포즈 · 드래그 시야 · 휠 확대<br>폰·패드: 왼쪽 엄지로 이동(끝까지 밀면 달리기) · 오른쪽 드래그 시야 · 두 손가락 확대</small></div></div>

<script type="module" src="./game.js"></script>
</body></html>
