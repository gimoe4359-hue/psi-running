  var dec = function (key) { return C.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct)).then(function (buf) { return new TextDecoder().decode(buf); }); };

  var useRaw = function (raw) { return C.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(dec); };
  var saved = null; try { saved = sessionStorage.getItem(K); } catch (e) {}
  if (saved) useRaw(b64(saved)).then(show).catch(function () { try { sessionStorage.removeItem(K); } catch (e) {} });
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault(); var p = document.getElementById('p'), v = p.value.trim(), er = document.getElementById('e'); if (!v) return;
    er.textContent = '확인 중…';
    fromPw(v).then(function (raw) { return useRaw(raw).then(function (h) { try { sessionStorage.setItem(K, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {} show(h); }); })
      .catch(function () { p.value = ''; er.textContent = '비밀번호가 맞지 않아요.'; });
  });
})();
