<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>AI 대화 테스트</title>
<style>
:root{--bg:#f6f7fb;--fg:#1c2230;--card:#fff;--line:#dde2ec;--accent:#3a6ad8}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ecf4;--card:#1b2030;--line:#2c3448;--accent:#7aa8ff}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;padding:20px 16px;max-width:560px;margin:auto}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 14px;font-size:14px;opacity:.75}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
button{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:800}
#out{margin-top:16px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;min-height:60px;line-height:1.6}
</style></head><body>
<h1>AI 대화 테스트</h1>
<p>유모자 팀장에게 말을 걸어 봐요. 답장이 오면 연결 성공이에요.</p>
<input id="q" value="팀장님 안녕하세요! 오늘 회식 있어요?">
<button id="b">보내기</button>
<div id="out">여기에 결과가 나와요.</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwiqBmXVY2nDlmyokpaDUxBxEezhbPRvYtKBA-kjVrHK0VU4pktS77wgRv9aN_ZWeTj/exec', out = document.getElementById('out'), b = document.getElementById('b');
const MSG = { network: '서버에 연결이 안 돼요 (인터넷 확인 또는 배포 주소 문제)', persona: '서버에 chat.gs가 아직 반영 안 됐어요 → 배포 관리에서 새 버전으로 배포했는지 확인', upstream: 'AI 키 문제예요 → GEMINI_KEY 값이 맞는지 확인', rate: '잠깐 너무 많이 보냈어요. 1분 뒤 다시', empty: '빈 답장이 왔어요. 한 번 더 눌러 보세요', server: '서버 코드 오류예요' };
b.onclick = async () => {
  b.disabled = true; out.textContent = '보내는 중… (최대 20초)';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'chat', persona: 'yumoja', dev: 'setup-test', messages: [{ role: 'user', content: document.getElementById('q').value }] }) });
    const j = await r.json();
    out.textContent = j.ok ? '✅ 연결 성공!\n\n유모자 팀장:\n' + j.reply : '❌ 실패: ' + (MSG[j.error] || j.error || JSON.stringify(j));
  } catch (e) { out.textContent = '❌ 실패: ' + MSG.network; }
  b.disabled = false;
};
</script></body></html>
