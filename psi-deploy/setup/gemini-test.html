<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Gemini 키 검사</title>
<style>
:root{--bg:#f6f7fb;--fg:#1c2230;--card:#fff;--line:#dde2ec;--accent:#3a6ad8}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ecf4;--card:#1b2030;--line:#2c3448;--accent:#7aa8ff}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;padding:20px 16px;max-width:560px;margin:auto}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 14px;font-size:14px;opacity:.75}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
button{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:800}
#out{margin-top:16px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-all;min-height:60px;line-height:1.6;font-size:14px}
</style></head><body>
<h1>Gemini 키 검사</h1>
<p>메모에 저장한 키를 붙여넣고 검사를 눌러요. 키는 이 기기에서 구글로만 바로 보내지고, 어디에도 저장되지 않아요.</p>
<input id="k" placeholder="여기에 키 붙여넣기 (AQ. 또는 AIza로 시작)" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="b">검사하기</button>
<div id="out">결과가 여기에 나와요. 끝나면 이 칸을 캡처해서 보내 주세요. (키는 안 보여요)</div>
<script>
const out = document.getElementById('out'), log = s => out.textContent += s + '\n';
const BASE = 'https://generativelanguage.googleapis.com/v1beta/';
document.getElementById('b').onclick = async () => {
  const key = document.getElementById('k').value.trim(); out.textContent = '';
  if (!key) { log('키를 먼저 붙여넣어 주세요.'); return; }
  log('키 모양: ' + key.slice(0, 3) + '… (' + key.length + '글자)' + (/\s/.test(key) ? ' ⚠️ 중간에 빈칸이 있어요' : ''));
  const H = { 'x-goog-api-key': key, 'Content-Type': 'application/json' };
  // 1) 쓸 수 있는 모델 목록
  let flash = [];
  try {
    const r = await fetch(BASE + 'models?pageSize=200', { headers: H }), j = await r.json();
    if (!r.ok) { log('\n① 모델 목록: ❌ ' + r.status + ' ' + ((j.error && (j.error.status + ' — ' + j.error.message)) || '')); }
    else {
      const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''));
      flash = names.filter(n => /flash/i.test(n) && !/image|tts|audio|live|embed/i.test(n));
      log('\n① 모델 목록: ✅ ' + names.length + '개 사용 가능');
      log('   Flash 계열: ' + (flash.slice(0, 8).join(', ') || '없음'));
    }
  } catch (e) { log('\n① 모델 목록: ❌ 연결 실패 (' + e.message + ')'); }
  // 2) 실제 대화 테스트
  const tries = ['gemini-flash-latest', ...flash.slice(0, 3)].filter((v, i, a) => a.indexOf(v) === i);
  for (const m of tries) {
    try {
      const r = await fetch(BASE + 'models/' + m + ':generateContent', { method: 'POST', headers: H, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: '안녕! 한 문장으로 인사해 줘.' }] }] }) });
      const j = await r.json();
      if (r.ok) { const t = (((j.candidates || [])[0] || {}).content || {}).parts || []; log('\n② ' + m + ': ✅ 성공 → ' + t.filter(p => !p.thought).map(p => p.text).join('').trim()); }
      else log('\n② ' + m + ': ❌ ' + r.status + ' ' + ((j.error && (j.error.status + ' — ' + j.error.message)) || ''));
    } catch (e) { log('\n② ' + m + ': ❌ 연결 실패 (' + e.message + ')'); }
  }
  log('\n검사 끝! 이 칸을 캡처해서 보내 주세요.');
};
</script></body></html>
