<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000"><title>주운 핸드폰</title>
<style>
:root{--ui:-apple-system,BlinkMacSystemFont,'SamsungOne','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --k-yel:#fee500;--k-room:#bacee0;--k-ink:#191919;--k-sub:#8e8e8e;--k-line:#f0f0f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d12;font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
/* ===== 기기: 넓은 화면은 갤럭시 실물 모양, 폰에선 꽉 채움 ===== */
#dev{position:absolute;inset:0;margin:auto;width:100vw;height:100dvh;background:#000;overflow:hidden}
@media (min-width:520px) and (min-height:700px){
  #dev{width:384px;height:min(824px,calc(100dvh - 40px));border-radius:44px;
    box-shadow:0 0 0 7px #0a0a0c,0 0 0 9px #4b4f58,0 0 0 10px #2a2d33,0 40px 90px rgba(0,0,0,.7)}
  #dev:before,#dev:after{content:'';position:absolute;right:-12px;width:3px;background:#3b3f47;border-radius:0 3px 3px 0}
  #dev:before{top:150px;height:70px}#dev:after{top:240px;height:44px}
}
#scr{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#000}
.cam{position:absolute;top:11px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2a3242 0,#050608 60%);z-index:90;pointer-events:none}
/* ===== 상태바 ===== */
.sb{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0 22px;font-size:13px;font-weight:500;letter-spacing:.1px;z-index:80;pointer-events:none;color:#fff}
.sb.dark{color:#1d1d1f}
.sb .l,.sb .r{display:flex;align-items:center;gap:5px}
.sb svg{height:13px;width:auto;fill:currentColor}
.sb .ni{width:13px;height:13px;border-radius:3px;background:currentColor;opacity:.9;display:grid;place-items:center}
.sb .ni:after{content:'';width:7px;height:5px;border-radius:50% 50% 50% 0;background:var(--niBg,#000)}
.sb .pc{font-size:12px}
.sb .ni[hidden]{display:none}
/* ===== 레이어 ===== */
.layer{position:absolute;inset:0;transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.hide{opacity:0;pointer-events:none;transform:scale(.97)}
#lock.hide{transform:translateY(-6%)}
/* ===== 배경화면 (One UI 기본 배경 느낌) ===== */
.wall{position:absolute;inset:0;overflow:hidden;background:#0d1b5c}
.wall i{position:absolute;border-radius:50%;filter:blur(2px)}
.wall .a{width:140%;height:70%;left:-40%;top:-12%;background:radial-gradient(closest-side,#8fb2ff,#4a6ef0 55%,transparent 72%);opacity:.95}
.wall .b{width:120%;height:60%;right:-45%;top:22%;background:radial-gradient(closest-side,#c9a2ff,#7a5cf0 55%,transparent 72%)}
.wall .c{width:130%;height:70%;left:-30%;bottom:-28%;background:radial-gradient(closest-side,#4fd2ff,#2b7bea 55%,transparent 72%);opacity:.9}
.wall .d{width:90%;height:40%;left:30%;bottom:6%;background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent 70%);opacity:.35}
.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,20,.18),transparent 30%,transparent 70%,rgba(0,0,20,.25))}
/* ===== 잠금화면 ===== */
#lock{color:#fff}
#lock .ck{position:absolute;top:70px;left:0;right:0;text-align:center}
#lock .ld{font-size:15px;font-weight:500;opacity:.95;letter-spacing:.2px}
#lock .lt{font-size:96px;font-weight:200;line-height:1;margin-top:4px;letter-spacing:-3px;text-shadow:0 2px 20px rgba(0,0,40,.18)}
#lock .notis{position:absolute;top:262px;left:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.noti{background:rgba(250,250,252,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#111;border-radius:24px;padding:12px 14px 13px;display:flex;gap:11px;align-items:flex-start}
.noti .nav2{width:38px;height:38px;flex:none;border-radius:14px;overflow:hidden}
.noti .tx{flex:1;min-width:0}
.noti .hd{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#6b6b6b;margin-bottom:2px}
.noti .hd i{width:13px;height:13px;border-radius:4px;background:var(--k-yel);display:inline-block}
.noti .hd small{margin-left:auto;font-size:11px}
.noti b{font-size:14px;font-weight:600;display:block}
.noti span{font-size:13.5px;color:#2a2a2a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#lock .fp{position:absolute;bottom:118px;left:50%;width:46px;height:46px;margin-left:-23px;opacity:.9}
#lock .fp svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.4;stroke-linecap:round}
#lock .hint{position:absolute;bottom:66px;left:0;right:0;text-align:center;font-size:12.5px;opacity:.85}
#lock .sc{position:absolute;bottom:52px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
#lock .sc.l{left:26px}#lock .sc.r{right:26px}
#lock .sc svg{width:24px;height:24px;fill:#fff}
/* ===== 홈 화면 ===== */
#home{color:#fff}
.hw{position:absolute;top:58px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-end;text-shadow:0 1px 6px rgba(0,0,30,.25)}
.hw .t{font-size:58px;font-weight:300;line-height:1;letter-spacing:-1.5px}
.hw .d{font-size:14px;margin-top:6px;font-weight:500}
.hw .w{text-align:right;font-size:12.5px;line-height:1.4}.hw .w b{font-size:30px;font-weight:300;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.hw .w svg{width:28px;height:28px}
.apps{position:absolute;top:196px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;letter-spacing:-.2px;text-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;position:relative;text-align:center}
.app .ico{width:56px;height:56px;border-radius:30%;overflow:hidden;position:relative;transition:transform .12s}
.app:active .ico{transform:scale(.92)}
.app .ico svg{width:100%;height:100%;display:block}
.app .bd{position:absolute;top:-5px;right:calc(50% - 36px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#f2492f;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;text-shadow:none}
.dots{position:absolute;bottom:208px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}.dots i.on{background:#fff}
.gbar{position:absolute;bottom:144px;left:20px;right:20px;height:48px;border-radius:24px;background:rgba(255,255,255,.92);display:flex;align-items:center;padding:0 16px;gap:10px;color:#666;font-size:14px}
.gbar .g{font-weight:800;font-size:19px;background:conic-gradient(from -45deg,#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.gbar .sp{flex:1}.gbar svg{width:20px;height:20px}
.dock{position:absolute;left:14px;right:14px;bottom:56px;display:grid;grid-template-columns:repeat(4,1fr)}
.dock .app span:last-child:not(.bd){display:none}
.hu{position:absolute;top:8px;left:8px;right:8px;z-index:96;background:rgba(252,252,254,.97);color:#111;border-radius:22px;padding:11px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.22);transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.9,.25,1.1);cursor:pointer}
.hu.on{transform:none}
.hu .pf{width:40px;height:40px}.hu .tx{flex:1;min-width:0}
.hu .hd{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#6b6b6b}.hu .hd i{width:13px;height:13px;border-radius:4px;background:var(--k-yel)}
.hu b{font-size:14px;font-weight:600;display:block;margin-top:1px}.hu span{font-size:13.5px;color:#2a2a2a;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(50,50,52,.94);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:22px;z-index:95;white-space:nowrap;transition:opacity .3s}
/* ===== 내비게이션 바 (최근 앱 · 홈 · 뒤로) ===== */
.nav{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;justify-content:space-around;align-items:center;z-index:85}
.nav button{background:none;border:0;width:90px;height:44px;display:grid;place-items:center;cursor:pointer}
.nav svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav.dark{background:#fff}.nav.dark svg{stroke:#404040}
.nav.room{background:#fff}
/* ===== 키카오톡 ===== */
#kk{background:#fff;color:var(--k-ink);padding-top:34px;display:flex;flex-direction:column}
.kh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px 20px}
.kh h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px}
.kh .ic{display:flex;gap:18px}.kh svg{width:23px;height:23px;stroke:#1b1b1b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ktabs{display:flex;justify-content:space-around;border-top:1px solid #f2f2f2;padding:7px 0 52px;background:#fff}
.ktabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9b9b9b;cursor:pointer;padding:2px 8px;font-family:var(--ui)}
.ktabs button.on{color:#1b1b1b}
.ktabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.ktabs button.on svg{fill:currentColor}
.row{display:flex;align-items:center;gap:13px;padding:8px 20px;cursor:pointer}
.row:active{background:#f5f5f5}
.pf{width:44px;height:44px;border-radius:38%;flex:none;overflow:hidden;position:relative}
.pf svg{width:100%;height:100%;display:block}
.pf.big{width:58px;height:58px}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:500;display:flex;gap:6px;align-items:center;letter-spacing:-.2px}
.row .nm em{font-style:normal;color:#a3a3a3;font-weight:400;font-size:14px}
.row .st{font-size:12.5px;color:var(--k-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .meta{font-size:11px;color:#a3a3a3;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:4px}
.row .un{background:#f2492f;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:1px 6px;min-width:20px;text-align:center}
.row.mine .nm{font-size:16px;font-weight:600}
.sec{font-size:12px;color:#8e8e8e;padding:14px 20px 6px;border-top:1px solid var(--k-line);margin-top:6px}
.grp{width:44px;height:44px;flex:none;position:relative}
.grp .pf{width:26px;height:26px;position:absolute}
.grp .pf:nth-child(1){left:0;top:0}.grp .pf:nth-child(2){right:0;top:0}.grp .pf:nth-child(3){left:0;bottom:0}.grp .pf:nth-child(4){right:0;bottom:0}
.grp.n2 .pf:nth-child(1){left:0;top:0;width:28px;height:28px}.grp.n2 .pf:nth-child(2){right:0;bottom:0;top:auto;width:28px;height:28px;box-shadow:0 0 0 2px #fff}
.grp.n3 .pf:nth-child(1){left:9px;top:0}.grp.n3 .pf:nth-child(2){left:0;top:auto;bottom:0}.grp.n3 .pf:nth-child(3){right:0;left:auto;bottom:0}
.empty{padding:50px 24px;text-align:center;color:#9b9b9b;font-size:13px;line-height:1.7}
/* ===== 채팅방 ===== */
#room{background:var(--k-room);padding-top:34px;display:flex;flex-direction:column;color:var(--k-ink)}
.rh{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 6px}
.rh button{background:none;border:0;padding:6px;cursor:pointer;display:flex;align-items:center}
.rh svg{width:23px;height:23px;stroke:#1b1b1b;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rh .tt{flex:1;font-size:16.5px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .tt small{font-size:15px;color:#6f7f8f;font-weight:500;margin-left:5px}
.msgs{flex:1;overflow-y:auto;padding:4px 10px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.day{text-align:center;margin:14px 0 12px}.day span{display:inline-flex;align-items:center;gap:4px;background:rgba(40,60,80,.18);color:#fff;font-size:11.5px;padding:4px 12px;border-radius:13px}
.m{display:flex;gap:8px;margin:2px 0;align-items:flex-start}
.m .pf{width:38px;height:38px}
.m .col{display:flex;flex-direction:column;max-width:70%}
.m .who{font-size:12px;color:#4e5b66;margin:1px 0 5px 1px}
.m .ln{display:flex;align-items:flex-end;gap:5px}
.bb{position:relative;background:#fff;padding:7px 11px 8px;border-radius:14px;font-size:14.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text;color:#191919}
.m.first .bb:before{content:'';position:absolute;top:0;left:-6px;width:12px;height:12px;background:inherit;clip-path:polygon(0 0,100% 0,100% 100%)}
.m.cont{padding-left:46px}.m.cont .pf{display:none}
.tm{font-size:10px;color:#56687a;flex:none;white-space:nowrap;margin-bottom:1px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.tm b{color:#e6b800;font-size:10.5px;font-weight:700}
.m:not(.me) .tm{align-items:flex-start}
.m.me{justify-content:flex-end}.m.me .ln{flex-direction:row-reverse}.m.me .col{align-items:flex-end}
.m.me .bb{background:var(--k-yel)}
.m.me.first .bb:before{left:auto;right:-6px;clip-path:polygon(0 0,100% 0,0 100%)}
.sys{text-align:center;font-size:12px;color:#4e5b66;margin:10px 0}
.typing .bb{display:flex;gap:4px;padding:12px 13px}.typing i{width:6px;height:6px;border-radius:50%;background:#b8b8b8;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.3;transform:translateY(-2px)}}
.ib{display:flex;align-items:center;gap:8px;padding:7px 10px 52px;background:#fff}
.ib .plus{width:30px;height:30px;flex:none;display:grid;place-items:center}
.ib .plus svg{width:22px;height:22px;stroke:#5a5a5a;fill:none;stroke-width:1.7;stroke-linecap:round}
.ib .fld{flex:1;display:flex;align-items:center;background:#f4f4f4;border-radius:20px;padding:0 6px 0 14px;min-height:38px}
.ib textarea{flex:1;border:0;resize:none;font:15px/1.4 var(--ui);max-height:96px;padding:9px 0;outline:none;background:transparent;color:#111;-webkit-user-select:text;user-select:text}
.ib .emo svg{width:22px;height:22px;stroke:#7a7a7a;fill:none;stroke-width:1.6}
.ib .send{border:0;background:var(--k-yel);border-radius:50%;width:34px;height:34px;display:none;place-items:center;cursor:pointer;flex:none}
.ib.has .send{display:grid}.ib.has .emo{display:none}
.ib .send svg{width:17px;height:17px;fill:#3a1d1d}
</style></head>
<body>
<div id="dev"><div id="scr">
  <div class="cam"></div>
  <div class="sb" id="sb"><span class="l"><span id="sbt">10:42</span><span class="ni" id="sbn" hidden></span></span><span class="r">
    <svg viewBox="0 0 22 16"><path d="M11 13.5a1.7 1.7 0 1 0 0 .01zM4.4 8.3l1.6 1.6a7 7 0 0 1 10 0l1.6-1.6a9.3 9.3 0 0 0-13.2 0zM1 4.9l1.6 1.6a11.9 11.9 0 0 1 16.8 0L21 4.9a14.2 14.2 0 0 0-20 0z"/></svg>
    <svg viewBox="0 0 20 16"><path d="M1 13h3v3H1zm5-3h3v6H6zm5-3h3v9h-3zm5-4h3v13h-3z"/></svg>
    <svg viewBox="0 0 27 13"><rect x=".7" y=".7" width="22.6" height="11.6" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".5"/><rect x="2.4" y="2.4" width="15" height="8.2" rx="1.8"/><rect x="24.4" y="4.2" width="2" height="4.6" rx="1" opacity=".5"/></svg>
    <span class="pc">72%</span></span></div>

  <!-- 잠금화면 -->
  <div class="layer" id="lock">
    <div class="wall"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
    <div class="ck"><div class="ld" id="ld"></div><div class="lt" id="lt">10:42</div></div>
    <div class="notis" id="notis"></div>
    <div class="fp"><svg viewBox="0 0 46 46"><path d="M14 33c-2-3-3-6.5-3-10a12 12 0 0 1 24 0v2"/><path d="M18 36c-2-3.5-3-8-3-13a8 8 0 0 1 16 0c0 3 0 6-1 9"/><path d="M23 23c0 5-1 10-4 15"/><path d="M27 25c0 4.5-1 9-3 13"/><path d="M31 30c-.5 3-1.5 6-3 8.5"/><path d="M12 13a14.5 14.5 0 0 1 22 0"/></svg></div>
    <div class="hint">위로 밀어서 잠금 해제</div>
    <div class="sc l"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
    <div class="sc r"><svg viewBox="0 0 24 24"><path d="M12 9.2a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2zM9 3 7.2 5H4.5A2.5 2.5 0 0 0 2 7.5v11A2.5 2.5 0 0 0 4.5 21h15a2.5 2.5 0 0 0 2.5-2.5v-11A2.5 2.5 0 0 0 19.5 5h-2.7L15 3zm3 15.2a5.4 5.4 0 1 1 0-10.8 5.4 5.4 0 0 1 0 10.8z"/></svg></div>
  </div>

  <!-- 홈 화면 -->
  <div class="layer hide" id="home">
    <div class="wall"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
    <div class="hw"><div><div class="t" id="ht">10:42</div><div class="d" id="hd"></div></div>
      <div class="w"><b><svg viewBox="0 0 32 32"><circle cx="12" cy="12" r="6" fill="#ffd54a"/><path d="M10 26h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 2A4 4 0 0 0 10 26z" fill="#f4f6fb"/></svg>17°</b>송천동<br>최고 21° / 최저 11°</div></div>
    <div class="apps" id="apps"></div>
    <div class="dots"><i class="on"></i><i></i></div>
    <div class="gbar"><span class="g">G</span><span class="sp">검색</span>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#4285f4"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#34a853" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="#4285f4"/><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3" stroke="#ea4335" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
    <div class="dock" id="dock"></div>
  </div>

  <!-- 키카오톡 -->
  <div class="layer hide" id="kk">
    <div class="kh"><h2 id="kt">친구</h2><div class="ic" id="kic"></div></div>
    <div class="kbody" id="kb"></div>

function dmRooms() { return Object.keys(extra).filter(k => k.startsWith('dm_') && PEOPLE[k.slice(3)]).map(k => dmRoom(k.slice(3))); }

/* ===== 채팅방 ===== */
function openRoom(r) { curRoom = r; $('#rt').innerHTML = esc(r.name) + (r.members.length > 1 ? `<small>${r.members.length + 1}</small>` : '');
  read[r.id] = logOf(r).filter(m => m[0] !== 'me' && m[0] !== 'sys').length; save('read', read); show('room'); renderRoom(); }
function renderRoom(typingId) {
  const L = logOf(curRoom), box = $('#msgs'); let h = '', prevDay = '', prev = null;
  // 아직 아무도 답하지 않은 내 메시지에는 안 읽은 숫자(1)를 표시
  let lastOther = -1; L.forEach((m, i) => { if (m[0] !== 'me' && m[0] !== 'sys') lastOther = i; });
  const unreadN = busy ? (curRoom.members.length > 1 ? curRoom.members.length : 1) : 0;
  L.forEach((m, i) => { const day = m[2].slice(0, 10); if (day !== prevDay) { h += `<div class="day"><span>${dayLabel(m[2])} ›</span></div>`; prevDay = day; prev = null; }
    if (m[0] === 'sys') { h += `<div class="sys">${esc(m[1])}</div>`; prev = null; return; }
    const nx = L[i + 1], same = (a, b) => a && b && a[0] === b[0] && a[2].slice(0, 16) === b[2].slice(0, 16);
    const cont = same(prev, m), showT = !same(m, nx), p = who(m[0]), me = m[0] === 'me';
    h += `<div class="m${me ? ' me' : ''}${cont ? ' cont' : ' first'}">${me ? '' : pic(p)}<div class="col">${!me && !cont ? `<div class="who">${esc(p.name)}</div>` : ''}<div class="ln"><div class="bb">${esc(m[1])}</div>${showT || (me && i > lastOther && unreadN) ? `<span class="tm">${me && i > lastOther && unreadN ? `<b>${unreadN}</b>` : ''}${showT ? ampm(m[2]) : ''}</span>` : ''}</div></div></div>`;
    prev = m; });
  if (typingId) h += `<div class="m first typing">${pic(who(typingId))}<div class="col"><div class="who">${esc(who(typingId).name)}</div><div class="ln"><div class="bb"><i></i><i></i><i></i></div></div></div></div>`;
  box.innerHTML = h; box.scrollTop = box.scrollHeight;
}
const inp = $('#in'), sendB = $('#send');
inp.addEventListener('input', () => { $('#ib').classList.toggle('has', !!inp.value.trim()); inp.style.height = 'auto'; inp.style.height = Math.min(96, inp.scrollHeight) + 'px'; });
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendB.click(); } });
let busy = false;
const ERR = { rate: '(메시지를 너무 많이 보냈어요. 잠깐 쉬었다가 보내 주세요)', network: '(서버에 연결이 안 됐어요. 다시 보내 주세요)', timeout: '(답장이 너무 오래 걸려서 끊겼어요. 다시 보내 주세요)',
  server: '(서버 오류가 났어요. 다시 보내 주세요)', persona: '(이 사람은 아직 대화 준비 중이에요)',
  upstream: '(답장이 안 와요… AI가 붐비는 중일 수 있어요. 조금 뒤 다시 보내 주세요)' };
const sleep = ms => new Promise(t => setTimeout(t, ms));
const shortName = id => PEOPLE[id].name.replace(/ (팀장|과장|대리|차장|부장)$/, '');
function idByName(n) { n = n.replace(/[\s:]/g, ''); return Object.keys(PEOPLE).find(id => PEOPLE[id].name.replace(/\s/g, '') === n)
  || Object.keys(PEOPLE).find(id => n.includes(shortName(id).replace(/\s/g, '')) || shortName(id).replace(/\s/g, '').includes(n)); }
sendB.onclick = async () => {
  const v = inp.value.trim(); if (!v || busy || !curRoom) return;
  const r = curRoom, arr = (extra[r.id] = extra[r.id] || []); arr.push(['me', v, nowStr()]); save('extra', extra);
  inp.value = ''; inp.dispatchEvent(new Event('input'));
  const named = r.members.find(id => v.includes(shortName(id)) || (shortName(id).length > 2 && v.includes(shortName(id).slice(1))));
  const first = named || r.members[0];
  busy = true; renderRoom(first);
  const res = await ask(r, first); busy = false;
  // 답장을 [보낸사람, 내용] 줄로 나누기 (단톡방은 "이름: 내용")
  let out = [];
  const dms = [];
  if (res.reply) res.reply.split('\n').map(x => x.trim()).filter(Boolean).forEach(line => {
    const dm = line.match(/^\[\s*갠톡\s*\]\s*([^:：]{1,12})\s*[:：]\s*(.+)$/);
    if (dm) { const id = idByName(dm[1]); if (id) dms.push([id, dm[2]]); return; }
    const m = r.members.length > 1 && line.match(/^([^:：]{1,12})\s*[:：]\s*(.+)$/), id = m && idByName(m[1]);
    if (m && m[1].trim() === '공유') return;                       // AI가 공유 말을 대신 쓰면 버려요
    if (m && id && r.members.includes(id)) out.push([id, m[2]]);
    else out.push([res.who || first, m ? m[2] : line]);
  });
  out = out.filter(x => x[1]).slice(0, 7);
  if (!out.length) out = [['sys', (ERR[res.error] || ERR.upstream) + (res.detail ? ' · ' + res.detail : '')]];
  for (let k = 0; k < out.length; k++) {
    if (k && out[k][0] !== 'sys') { if (curRoom === r) renderRoom(out[k][0]); await sleep(Math.min(1100, 260 + out[k][1].length * 14)); }
    arr.push([out[k][0], out[k][1], nowStr()]); save('extra', extra);
    if (curRoom === r && cur === 'room') { read[r.id] = logOf(r).filter(m => m[0] !== 'me' && m[0] !== 'sys').length; save('read', read); renderRoom(); }
  }
  if (curRoom === r) renderRoom();

/* ===== 갠톡(선톡): 다른 사람이 공유에게 따로 보내는 메시지 ===== */
const DM_RULE = '[갠톡 규칙] 공유의 말이 이상하거나, 엉뚱하거나, 걱정되거나, 단톡방에서 말하기 곤란한 내용이면 맨 끝에 "[갠톡] 이름: 내용" 형식의 줄을 1~2개 덧붙인다. 이것은 그 인물이 단톡방이 아니라 공유에게 따로 보내는 1:1 카톡이다(예: 걱정, 뒷얘기, 몰래 하는 말). 평범한 대화에서는 절대 쓰지 않는다.';
async function deliverDMs(list) {
  const byWho = {}; list.forEach(([id, t]) => (byWho[id] = byWho[id] || []).push(t));
  for (const id of Object.keys(byWho)) {
    await sleep(2500 + Math.random() * 2500);
    const room = dmRoom(id), arr = (extra[room.id] = extra[room.id] || []);
    byWho[id].forEach(t => arr.push([id, t, nowStr()])); save('extra', extra);
    if (curRoom && curRoom.id === room.id && cur === 'room') { read[room.id] = logOf(room).filter(m => m[0] !== 'me' && m[0] !== 'sys').length; save('read', read); renderRoom(); }
    else { headsUp(room, id, byWho[id][byWho[id].length - 1]); if (cur === 'kk') renderKK(); if (cur === 'home') renderHome(); if (cur === 'lock') renderLock(); show(cur); }
  }
}
function headsUp(room, id, text) {
  $$('.hu').forEach(e => e.remove());
  const e = document.createElement('div'); e.className = 'hu';
  e.innerHTML = `${pic(who(id))}<div class="tx"><div class="hd"><i></i>키카오톡 · 지금</div><b>${esc(who(id).name)}</b><span>${esc(text)}</span></div>`;
  e.onclick = () => { e.remove(); if (cur === 'lock') renderHome(); openRoom(room); };
  $('#scr').append(e); requestAnimationFrame(() => requestAnimationFrame(() => e.classList.add('on')));

}
/* 서버 요청: 45초까지 기다리고, 연결이 끊기거나 AI가 붐비면 자동으로 한 번 더 시도 */
const MODELS = ['gemini-flash-lite-latest', 'gemini-flash-latest', 'gemini-3.1-flash-lite', 'gemini-3.5-flash'];
async function post1(body) {
  const c = new AbortController(), to = setTimeout(() => c.abort(), 45000);
  try { const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: c.signal, body: JSON.stringify(Object.assign({ models: MODELS }, body)) });
    const txt = await res.text(); try { return JSON.parse(txt); } catch (e) { return { ok: false, error: 'server', detail: 'HTTP ' + res.status }; }
  } catch (e) { return { ok: false, error: e.name === 'AbortError' ? 'timeout' : 'network' }; } finally { clearTimeout(to); }
}
async function post(body) {
  let j = await post1(body);
  if (!j.ok && /network|timeout|upstream|server/.test(j.error)) { await sleep(1200); const j2 = await post1(body); if (j2.ok || j2.error === 'persona') j = j2; else j.detail = (j.detail || (j.codes || []).join(',')) + ' / ' + (j2.detail || (j2.codes || []).join(',')); }
  if (j.ms) console.log('[phone] AI', j.model, j.ms + 'ms', j.codes);
  return j;
}
function mergeMsgs(list) { const merged = []; list.forEach(m => { const l = merged[merged.length - 1]; if (l && l.role === m.role) l.content += '\n' + m.content; else merged.push({ ...m }); });
  if (merged.length && merged[0].role !== 'user') merged.unshift({ role: 'user', content: '(공유가 카톡방을 열었다)' }); return merged; }
async function ask(r, first) {
  const group = r.members.length > 1, L = logOf(r).filter(m => m[0] !== 'sys').slice(-30);
  let j;
  if (group) {
    // 단톡방: AI가 멤버 전원을 연기 → 멤버 말 = assistant("이름: 내용"), 공유 말 = user
    const msgs = mergeMsgs(L.map(m => m[0] === 'me' ? { role: 'user', content: m[1] } : { role: 'assistant', content: who(m[0]).name + ': ' + m[1] }));
    j = await post({ action: 'chat', mode: 'phone', cards: r.members.map(id => ({ name: PEOPLE[id].name, card: PEOPLE[id].card })), ctx: r.ctx || '', rules: DM_RULE, dev, messages: msgs });
    if (j.ok) return { reply: j.reply };
  }
  // 1:1 (또는 예전 서버): 대답하는 사람 말 = assistant, 나머지 = user
  const msgs = mergeMsgs(L.map(m => m[0] === first ? { role: 'assistant', content: m[1] } : { role: 'user', content: (group ? (m[0] === 'me' ? '공유: ' : who(m[0]).name + ': ') : '') + m[1] }));
  const p = PEOPLE[first];
  if (!group || (j && j.error === 'persona')) j = await post({ action: 'chat', mode: 'phone', card: p.card, ctx: r.ctx || '', dev, messages: msgs });
  // 서버가 아직 예전 버전이면(인물 설정을 못 받음) 등록된 캐릭터 id로 다시 시도
  if (!j.ok && j.error === 'persona' && p.persona) j = await post({ action: 'chat', persona: p.persona, dev, messages: msgs });
  return j.ok ? { reply: j.reply, who: first } : { error: j.error || 'upstream', detail: j.detail || (j.codes || []).join(',') };
}

/* 오랜만에 폰을 열면(45분 이상) 누군가 먼저 카톡을 보내요 */
async function maybeFirstTalk() {

  if (!last || !talked || Date.now() - last < 45 * 60000) return;   // 처음 연 날은 건너뛰어요

  const recent = allRooms().filter(x => x.members.includes(id)).flatMap(x => logOf(x).slice(-6).map(m => (m[0] === 'me' ? '공유' : who(m[0]).name) + ': ' + m[1])).slice(-10).join('\n');

  const j = await post({ action: 'chat', mode: 'phone', card: PEOPLE[id].card, ctx: (room.ctx || '') + (recent ? '\n최근 대화:\n' + recent : ''), dev, messages: mergeMsgs(msgs) });
  if (!j.ok || !j.reply) return;
  deliverDMs(j.reply.split('\n').map(x => x.trim().replace(/^[^:：]{1,12}[:：]\s*/, '')).filter(Boolean).slice(0, 3).map(t => [id, t]));
}
setTimeout(maybeFirstTalk, 2500);

/* 엄마는 먼저 말을 걸어 와요 (처음 열었을 때만) */
(() => { const r = ROOMS.find(x => x.id === 'dm_mom'); if (!r || logOf(r).length) return;
  const d = new Date(Date.now() - 95 * 60000), t = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  extra.dm_mom = [['mom', '공유야 밥은 먹었니', t], ['mom', '요즘 회사 일 많이 힘들지? 엄마가 반찬 좀 보내줄까', t]]; save('extra', extra); })();
